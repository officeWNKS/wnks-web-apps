<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสืบค้นบุคลากรและภาระงาน - โรงเรียนวังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core Colors */
            --navy-bg: #030B14;
            --navy-dark: #0B192C;
            --navy-main: #1A365D;
            --gold-light: #FCE8B2;
            --gold-main: #D4AF37;
            --gold-dark: #A67C00;
            --white: #FFFFFF;
            
            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-card: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --radius-lg: 30px;
            --radius-md: 20px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--navy-bg);
            color: var(--navy-dark);
            min-height: 100vh;
            padding: 3rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Liquid Orbs Background --- */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: var(--navy-dark);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-1 {
            background: var(--gold-dark);
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            background: var(--navy-main);
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            background: var(--gold-light);
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- Layout & Glass Panels --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            padding: 2.5rem;
            margin-bottom: 2rem;
            transition: all 0.4s ease;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 3rem;
            color: var(--white);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-main) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header h2 {
            font-weight: 400;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        header p {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 300;
        }

        /* --- Apple-style Segmented Tabs --- */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0.4rem;
            border-radius: 100px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            font-weight: 500;
            border-radius: 100px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .tab-btn.active {
            color: var(--navy-dark);
            font-weight: 600;
        }

        .tab-bg {
            position: absolute;
            top: 0.4rem;
            bottom: 0.4rem;
            width: calc(50% - 0.4rem);
            background: var(--white);
            border-radius: 100px;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Logic for tab sliding */
        .tabs[data-active="by-person"] .tab-bg { transform: translateX(0); }
        .tabs[data-active="by-dept"] .tab-bg { transform: translateX(100%); }

        .tab-content {
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Form Controls --- */
        .input-group {
            margin-bottom: 2rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--navy-main);
            font-size: 1.1rem;
        }

        select {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1rem;
            border: 1px solid var(--white);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.8);
            color: var(--navy-main);
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%231A365D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1.5rem center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        select:focus, select:hover {
            background: var(--white);
            border-color: var(--gold-main);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        /* --- Content Cards (Person View) --- */
        .card {
            background: var(--glass-card);
            border-radius: var(--radius-md);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            background: rgba(255, 255, 255, 0.7);
        }

        .dept-label {
            font-size: 0.85rem;
            color: var(--gold-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .card h3 {
            color: var(--navy-dark);
            margin-bottom: 1rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .role-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--navy-main) 0%, var(--navy-dark) 100%);
            color: var(--white);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(11, 25, 44, 0.2);
        }

        /* --- Lists --- */
        .duties-list {
            list-style: none;
        }

        .duties-list li {
            position: relative;
            padding-left: 1.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            color: #2C3E50;
            line-height: 1.7;
        }

        .duties-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            background: var(--gold-main);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        /* --- Accordion (Dept View) --- */
        .accordion-item {
            margin-bottom: 1rem;
            border-radius: var(--radius-md);
            background: var(--glass-card);
            border: 1px solid rgba(255,255,255,0.7);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .accordion-item.active {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-color: var(--white);
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 1.5rem;
            background: transparent;
            border: none;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--navy-dark);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chevron {
            width: 24px;
            height: 24px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            fill: none;
            stroke: var(--navy-main);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .accordion-item.active .chevron {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-body {
            padding: 0 1.5rem 1.5rem 1.5rem;
        }
        
        .sub-job-title {
            color: var(--navy-main);
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(26, 54, 93, 0.1);
        }

        .personnel-list {
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .person-tag {
            background: var(--white);
            color: var(--navy-dark);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            border: 1px solid rgba(0,0,0,0.05);
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
        }
        
        .person-tag span {
            color: var(--gold-dark);
            margin-right: 6px;
            font-weight: 600;
        }

        /* --- Scrollbar Customization --- */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .glass-panel { padding: 1.5rem; }
            .gradient-text { font-size: 2rem; }
            .tabs { flex-direction: column; background: transparent; border: none; padding: 0; margin-bottom: 1.5rem; }
            .tab-bg { display: none; }
            .tab-btn { background: rgba(255, 255, 255, 0.1); margin-bottom: 0.5rem; color: var(--white); }
            .tab-btn.active { background: var(--white); color: var(--navy-dark); box-shadow: var(--glass-shadow); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="gold-gradient-text">ระบบสืบค้นบุคลากรและภาระงาน</h1>
            <h2 style="color: white; font-weight: 400; margin-bottom: 0.5rem;">โรงเรียนวังน้ำคู้ศึกษา</h2>
            <p>อ้างอิง: คำสั่งโรงเรียนวังน้ำคู้ศึกษา ที่ 64/2569 (ภาคเรียนที่ 1 ปีการศึกษา 2569)</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('by-person')">ค้นหาตามรายชื่อ</button>
            <button class="tab-btn" onclick="switchTab('by-dept')">ค้นหาตามกลุ่มงาน/ฝ่าย</button>
        </div>

        <!-- Tab 1: By Person -->
        <div id="by-person" class="tab-content active glass-panel">
            <h3 style="margin-bottom: 1rem; color: var(--navy-main);">เลือกรายชื่อบุคลากร</h3>
            <select id="personSelect" onchange="renderPersonData()">
                <option value="">-- โปรดเลือกรายชื่อ --</option>
                <!-- Options populated by JS -->
            </select>
            <div id="personResultArea">
                <!-- Results go here -->
                <p style="text-align: center; color: #666;">กรุณาเลือกรายชื่อเพื่อดูภาระงาน</p>
            </div>
        </div>

        <!-- Tab 2: By Department -->
        <div id="by-dept" class="tab-content glass-panel">
            <h3 style="margin-bottom: 1rem; color: var(--navy-main);">เลือกกลุ่มบริหารงาน</h3>
            <div id="deptAccordionContainer">
                <!-- Accordions populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลถูกคัดลอกมาแบบสมบูรณ์ 100% ไม่มีการตัดทอน
        const rawData = [
            {
                dept: "คณะกรรมการบริหารโรงเรียน",
                jobs: [
                    {
                        jobName: "คณะกรรมการบริหารโรงเรียน",
                        personnel: [
                            { role: "ผู้อำนวยการโรงเรียน", name: "นายมนูญ บุบผาพ่วง" },
                            { role: "ผู้ช่วยผู้อำนวยการกลุ่มบริหารงานวิชาการ", name: "นางสาวชนิกานต์ กลิ่นอาจ" },
                            { role: "ผู้ช่วยผู้อำนวยการกลุ่มบริหารงานงบประมาณ", name: "นายจตุรภัทร บัวสถิตย์" },
                            { role: "ผู้ช่วยผู้อำนวยการกลุ่มบริหารงานบุคคลและงานกิจการนักเรียน", name: "นางสาวรัตน์ชนิดา อิ่มอ่อง" },
                            { role: "ผู้ช่วยผู้อำนวยการกลุ่มบริหารงานทั่วไป", name: "นายสุขุมพัฒน์ กันธะมา" }
                        ],
                        duties: [
                            "1. กำหนดนโยบาย ทิศทางการจัดการศึกษา แผนพัฒนา และแผนปฏิบัติการประจำปีของสถานศึกษาให้สอดคล้องกับกฎหมาย ระเบียบ และนโยบายของหน่วยงานต้นสังกัด",
                            "2. บริหารและกำกับการดำเนินงานของสถานศึกษา พร้อมประสานความร่วมมือและสร้างความเข้าใจกับทุกภาคส่วนที่เกี่ยวข้อง",
                            "3. นิเทศ กำกับ ติดตาม ตรวจสอบ และประเมินผลการปฏิบัติงานของครูและบุคลากร รวมทั้งให้คำปรึกษา แก้ไขปัญหา และเสริมสร้างขวัญกำลังใจในการปฏิบัติงาน",
                            "4. พิจารณาปัญหา สาเหตุ แนวทางแก้ไข และวินิจฉัยข้อร้องทุกข์จากชุมชน ผู้ปกครอง ครู และนักเรียน เพื่อพัฒนาการบริหารจัดการของสถานศึกษา",
                            "5. พิจารณาให้ความเห็นชอบหลักสูตรสถานศึกษา ระเบียบ ข้อบังคับ และแนวปฏิบัติต่าง ๆ ให้สอดคล้องกับบริบทและความต้องการของท้องถิ่น",
                            "6. กำกับ ดูแล และให้ความเห็นชอบด้านการเงิน การบัญชี รายงานประจำปี งบดุล รวมทั้งการแต่งตั้งผู้ตรวจสอบบัญชีตามระเบียบที่กำหนด",
                            "7. วางแผน ปรับปรุง และพัฒนาคุณภาพการศึกษา ตลอดจนดำเนินงานอื่นตามที่ได้รับมอบหมาย",
                            "8. ปฏิบัติงานอื่น ๆ ตามที่ได้รับมอบหมาย"
                        ]
                    }
                ]
            },
            {
                dept: "กลุ่มบริหารงานวิชาการ",
                jobs: [
                    {
                        jobName: "คณะกรรมการกลุ่มบริหารงานวิชาการ",
                        personnel: [
                            { role: "หัวหน้ากลุ่มบริหารงานวิชาการ", name: "นางสาวชนิกานต์ กลิ่นอาจ" },
                            { role: "รองหัวหน้ากลุ่มบริหารงานวิชาการ", name: "นางกมลวรรณ บรรดาสุข" }
                        ],
                        duties: [
                            "1. ปฏิบัติหน้าที่ผู้ช่วยรองผู้อำนวยการโรงเรียน กลุ่มบริหารวิชาการ และปฏิบัติราชการแทนรองผู้อำนวยการกลุ่มบริหารวิชาการ ในกรณีไปราชการ ลา หรือไม่สามารถปฏิบัติหน้าที่ได้",
                            "2. ประสานงานการดำเนินงานของกลุ่มบริหารวิชาการ คณะกรรมการบริหารหลักสูตร และงานวิชาการ เพื่อให้การปฏิบัติงานเป็นไปอย่างมีประสิทธิภาพและบรรลุเป้าหมาย",
                            "3. ประสานงาน จัดเตรียม และรวบรวมข้อมูลเพื่อจัดทำปฏิทินปฏิบัติงาน งานสารสนเทศ ระเบียบ แนวปฏิบัติราชการ และประชาสัมพันธ์ข้อมูลแก่ครูและผู้เกี่ยวข้อง",
                            "4. ประสานและอำนวยความสะดวกในการจัดกิจกรรมส่งเสริมคุณภาพงานวิชาการ รวมทั้งกิจกรรมต่าง ๆ ของโรงเรียนให้เป็นไปตามแผนปฏิบัติการ",
                            "5. นิเทศ กำกับ ติดตาม ตรวจสอบ ประเมินผล และพัฒนาการดำเนินงานของกลุ่มบริหารวิชาการให้เป็นไปตามแผนงานและปฏิทินปฏิบัติงาน",
                            "6. ปฏิบัติงานอื่น ๆ ตามที่ได้รับมอบหมาย"
                        ]
                    },
                    {
                        jobName: "2.1 งานพัฒนาหลักสูตรและการเรียนการสอน",
                        personnel: [
                            { role: "หัวหน้างาน", name: "นางสายธาร หิรัญสุข" },
                            { role: "ผู้ช่วย", name: "นางกมลวรรณ บรรดาสุข" },
                            { role: "ผู้ช่วย", name: "นางสาวชนิกานต์ กลิ่นอาจ" }

        // สกัดรายชื่อบุคลากรทั้งหมด (ไม่ซ้ำ)
        function getUniquePersonnel() {
            let names = new Set();
            rawData.forEach(dept => {
                dept.jobs.forEach(job => {
                    job.personnel.forEach(person => {
                        // แยกชื่อกรณีที่เป็นลิสต์เวรประจำวัน
                        let splitNames = person.name.split(',').map(n => n.trim());
                        splitNames.forEach(n => {
                            if(n && n !== "ครูที่ปรึกษาทุกระดับชั้น") {
                                names.add(n);
                            }
                        });
                    });
                });
            });
            return Array.from(names).sort();
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            // เติม Dropdown รายชื่อ
            const personSelect = document.getElementById('personSelect');
            const uniqueNames = getUniquePersonnel();
            uniqueNames.forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                personSelect.appendChild(opt);
            });

            // เติม Accordion รายฝ่าย
            renderDepartments();
        });

        // ระบบ Tab Switch
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // แท็บ 1: Render ข้อมูลรายบุคคล
        function renderPersonData() {
            const selectedName = document.getElementById('personSelect').value;
            const resultArea = document.getElementById('personResultArea');
            resultArea.innerHTML = '';

            if(!selectedName) {
                resultArea.innerHTML = '<p style="text-align: center; color: #666;">กรุณาเลือกรายชื่อเพื่อดูภาระงาน</p>';
                return;
            }

            let foundJobs = [];

            rawData.forEach(dept => {
                dept.jobs.forEach(job => {
                    let hasPerson = job.personnel.some(p => p.name.includes(selectedName));
                    if(hasPerson) {
                        let roleForThisPerson = job.personnel.find(p => p.name.includes(selectedName)).role;
                        foundJobs.push({
                            deptName: dept.dept,
                            jobName: job.jobName,
                            role: roleForThisPerson,
                            duties: job.duties
                        });
                    }
                });
            });

            if(foundJobs.length === 0) {
                resultArea.innerHTML = '<p style="text-align: center; color: red;">ไม่พบข้อมูลภาระงาน</p>';
                return;
            }

            let html = `<h4 style="margin-bottom: 1rem; color: var(--navy-dark);">ภาระงานของ: ${selectedName} (${foundJobs.length} งาน)</h4>`;
            
            foundJobs.forEach(job => {
                // เปลี่ยนการทำ list ให้รองรับการขึ้นบรรทัดใหม่จาก \n
                let dutiesHtml = job.duties.map(d => {
                    let formattedLine = d.replace(/\n/g, '<br>&nbsp;&nbsp;&nbsp;&nbsp;');
                    return `<li>${formattedLine}</li>`;
                }).join('');

                html += `
                    <div class="card">
                        <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">${job.deptName}</div>
                        <h3>${job.jobName}</h3>
                        <div class="role-badge">${job.role}</div>
                        <ul class="duties-list">
                            ${dutiesHtml}
                        </ul>
                    </div>
                `;
            });

            resultArea.innerHTML = html;
        }

        // แท็บ 2: Render ข้อมูลรายฝ่ายงาน
        function renderDepartments() {
            const container = document.getElementById('deptAccordionContainer');
            let html = '';

            rawData.forEach((dept, deptIndex) => {
                let jobsHtml = '';
                dept.jobs.forEach(job => {
                    let personnelHtml = job.personnel.map(p => `<span class="person-tag">${p.role}: ${p.name}</span>`).join('');
                    
                    let dutiesHtml = job.duties.map(d => {
                        let formattedLine = d.replace(/\n/g, '<br>&nbsp;&nbsp;&nbsp;&nbsp;');
                        return `<li>${formattedLine}</li>`;
                    }).join('');
                    
                    jobsHtml += `
                        <div class="sub-job-title">${job.jobName}</div>
                        <div class="personnel-list">
                            ${personnelHtml}
                        </div>
                        <ul class="duties-list">
                            ${dutiesHtml}
                        </ul>
                    `;
                });

                html += `
                    <div class="accordion-item">
                        <button class="accordion-header" onclick="toggleAccordion(${deptIndex})">
                            ${dept.dept}
                            <span id="icon-${deptIndex}">+</span>
                        </button>
                        <div class="accordion-content" id="content-${deptIndex}">
                            <div class="accordion-body">
                                ${jobsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ฟังก์ชั่นเปิด/ปิด Accordion
        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.textContent = "+";
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.textContent = "−";
            }
        }
    </script>
