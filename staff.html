<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสืบค้นบุคลากรและภาระงาน - โรงเรียนวังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #051622;
            --navy-main: #0B2447;
            --navy-light: #19376D;
            --gold-light: #FDE5A9;
            --gold-main: #D4AF37;
            --gold-dark: #AA8222;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-liquid: 0 10px 40px rgba(0, 0, 0, 0.2);
            --radius-liquid: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-main) 50%, var(--navy-light) 100%);
            color: var(--navy-dark);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-attachment: fixed;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Typography & Gradients */
        .gold-gradient-text {
            background: linear-gradient(45deg, var(--gold-light), var(--gold-main), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        /* Glassmorphism Components */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-liquid);
            box-shadow: var(--shadow-liquid);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            border-radius: 30px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--white);
            font-size: 1rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: linear-gradient(45deg, var(--gold-main), var(--gold-dark));
            color: var(--navy-dark);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Controls */
        select {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid rgba(11, 36, 71, 0.1);
            border-radius: 15px;
            background: var(--white);
            color: var(--navy-main);
            outline: none;
            transition: border-color 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%230B2447%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1.5rem top 50%;
            background-size: 0.8rem auto;
            margin-bottom: 1.5rem;
        }

        select:focus {
            border-color: var(--gold-main);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        /* Cards & Accordions */
        .card {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .card h3 {
            color: var(--navy-main);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card h3::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-main));
            border-radius: 4px;
        }

        .role-badge {
            display: inline-block;
            background: var(--navy-light);
            color: var(--white);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .duties-list {
            list-style: none;
        }

        .duties-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.5;
        }

        .duties-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--gold-dark);
            font-size: 1.5rem;
            line-height: 1;
            top: -2px;
        }

        /* Accordion for Department View */
        .accordion-item {
            margin-bottom: 1rem;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 1rem 1.5rem;
            background: transparent;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--navy-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: rgba(255, 255, 255, 0.4);
        }

        .accordion-body {
            padding: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .personnel-list {
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .person-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--navy-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-weight: 500;
        }

        .sub-job-title {
            color: var(--navy-main);
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.3rem;
            border-bottom: 2px dashed rgba(11, 36, 71, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .tabs {
                flex-direction: column;
                border-radius: 15px;
            }
            .tab-btn {
                border-radius: 10px;
            }
            .glass-panel {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="gold-gradient-text">ระบบสืบค้นบุคลากรและภาระงาน</h1>
            <h2 style="color: white; font-weight: 400; margin-bottom: 0.5rem;">โรงเรียนวังน้ำคู้ศึกษา</h2>

        </header>

        <div class="tabs">

                <option value="">-- โปรดเลือกรายชื่อ --</option>
                <!-- Options populated by JS -->
            </select>
            <div id="personResultArea">

                <p style="text-align: center; color: #666;">กรุณาเลือกรายชื่อเพื่อดูภาระงาน</p>
            </div>
        </div>

        <!-- Tab 2: By Department -->

            <div id="deptAccordionContainer">
                <!-- Accordions populated by JS -->
            </div>
        </div>
    </div>

                            { role: "ผู้ช่วย", name: "ครูที่ปรึกษาทุกระดับชั้น" }
                        ],
                        duties: [
                            "รณรงค์คัดแยกขยะ การใช้ทรัพยากรคุ้มค่า (3Rs)",
                            "จัดพื้นที่และอุปกรณ์รองรับการคัดแยกขยะ"
                        ]
                    }
                ]
            }
        ];

        // สกัดรายชื่อบุคลากรทั้งหมด (ไม่ซ้ำ)
        function getUniquePersonnel() {
            let names = new Set();
            rawData.forEach(dept => {
                dept.jobs.forEach(job => {
                    job.personnel.forEach(person => {
                        // แยกชื่อกรณีที่เป็นลิสต์เวรประจำวัน
                        let splitNames = person.name.split(',').map(n => n.trim());
                        splitNames.forEach(n => {
                            if(n && n !== "ครูที่ปรึกษาทุกระดับชั้น") {
                                names.add(n);
                            }
                        });
                    });
                });
            });
            return Array.from(names).sort();
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            // เติม Dropdown รายชื่อ
            const personSelect = document.getElementById('personSelect');
            const uniqueNames = getUniquePersonnel();
            uniqueNames.forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                personSelect.appendChild(opt);
            });

            // เติม Accordion รายฝ่าย
            renderDepartments();
        });

        // ระบบ Tab Switch
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // แท็บ 1: Render ข้อมูลรายบุคคล
        function renderPersonData() {
            const selectedName = document.getElementById('personSelect').value;
            const resultArea = document.getElementById('personResultArea');
            resultArea.innerHTML = '';

            if(!selectedName) {
                resultArea.innerHTML = '<p style="text-align: center; color: #666;">กรุณาเลือกรายชื่อเพื่อดูภาระงาน</p>';
                return;
            }

            let foundJobs = [];

            rawData.forEach(dept => {
                dept.jobs.forEach(job => {
                    let hasPerson = job.personnel.some(p => p.name.includes(selectedName));
                    if(hasPerson) {
                        let roleForThisPerson = job.personnel.find(p => p.name.includes(selectedName)).role;
                        foundJobs.push({
                            deptName: dept.dept,
                            jobName: job.jobName,
                            role: roleForThisPerson,
                            duties: job.duties
                        });
                    }
                });
            });

            if(foundJobs.length === 0) {
                resultArea.innerHTML = '<p style="text-align: center; color: red;">ไม่พบข้อมูลภาระงาน</p>';
                return;
            }

            let html = `<h4 style="margin-bottom: 1rem; color: var(--navy-dark);">ภาระงานของ: ${selectedName} (${foundJobs.length} งาน)</h4>`;
            
            foundJobs.forEach(job => {
                let dutiesHtml = job.duties.map(d => `<li>${d}</li>`).join('');
                html += `
                    <div class="card">
                        <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">${job.deptName}</div>
                        <h3>${job.jobName}</h3>
                        <div class="role-badge">${job.role}</div>
                        <ul class="duties-list">
                            ${dutiesHtml}
                        </ul>
                    </div>
                `;
            });

            resultArea.innerHTML = html;
        }

        // แท็บ 2: Render ข้อมูลรายฝ่ายงาน
        function renderDepartments() {
            const container = document.getElementById('deptAccordionContainer');
            let html = '';

            rawData.forEach((dept, deptIndex) => {
                let jobsHtml = '';
                dept.jobs.forEach(job => {
                    let personnelHtml = job.personnel.map(p => `<span class="person-tag">${p.role}: ${p.name}</span>`).join('');
                    let dutiesHtml = job.duties.map(d => `<li>${d}</li>`).join('');
                    
                    jobsHtml += `
                        <div class="sub-job-title">${job.jobName}</div>
                        <div class="personnel-list">
                            ${personnelHtml}
                        </div>
                        <ul class="duties-list">
                            ${dutiesHtml}
                        </ul>
                    `;
                });

                html += `
                    <div class="accordion-item">
                        <button class="accordion-header" onclick="toggleAccordion(${deptIndex})">
                            ${dept.dept}
                            <span id="icon-${deptIndex}">+</span>
                        </button>
                        <div class="accordion-content" id="content-${deptIndex}">
                            <div class="accordion-body">
                                ${jobsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ฟังก์ชั่นเปิด/ปิด Accordion
        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.textContent = "+";
            } else {
                // ปิดอันอื่น (ถ้าต้องการให้เปิดได้ทีละอัน ให้เปิดโค้ดด้านล่าง)
                // document.querySelectorAll('.accordion-content').forEach(c => c.style.maxHeight = null);
                // document.querySelectorAll('.accordion-header span').forEach(i => i.textContent = "+");
                
                content.style.maxHeight = content.scrollHeight + "px";
                icon.textContent = "−";
            }
        }
    </script>
</body>
</html>
