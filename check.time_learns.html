<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเช็คชื่อ - ร.ร.วังน้ำคู้ศึกษา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- กำหนดโทนสี กรม-ทอง ผ่าน Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 700: '#1E3A5F', 800: '#152A4A', 900: '#0D1B2A' },
                        gold: { 400: '#F4D03F', 500: '#D4AF37', 600: '#AA8C2C' }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .loader {
            border: 4px solid #E2E8F0; border-top: 4px solid #D4AF37;
            border-radius: 50%; width: 48px; height: 48px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* ซ่อน Radio button เดิม */
        input[type="radio"].peer { display: none; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header Section (สีกรม) -->
    <div class="bg-navy-900 rounded-b-[2rem] shadow-lg px-6 pt-10 pb-16 relative">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-gold-500 tracking-wide">ระบบเช็คชื่อเข้าเรียน</h1>
            <p class="text-gray-300 mt-2 text-sm font-light tracking-wider">โรงเรียนวังน้ำคู้ศึกษา</p>
        </div>
    </div>

    <!-- Main Content Container (ลอยทับ Header) -->
    <div class="max-w-4xl mx-auto px-4 -mt-10 mb-10">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-4 md:p-8">
            
            <!-- แท็บเมนู -->
            <div class="flex bg-gray-50 p-1.5 rounded-2xl mb-8">
                <button id="tab-attendance" class="flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl bg-white text-navy-800 shadow-sm transition-all">📝 เช็คชื่อ</button>
                <button id="tab-summary" class="flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl text-gray-400 hover:text-navy-700 transition-all">📊 สรุปผล</button>
            </div>

            <!-- หน้าต่างโหลดข้อมูลตอนเริ่ม -->
            <div id="loading" class="flex flex-col items-center justify-center py-16">
                <div class="loader mb-6"></div>
                <p class="text-navy-800 font-medium">กำลังเตรียมข้อมูลระบบ...</p>
            </div>

            <div id="main-content" class="hidden">
                <!-- ส่วนเลือกรายวิชา (UI ใหม่ ขอบมน) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div id="date-container" class="relative">
                        <label class="absolute -top-2.5 left-4 bg-white px-2 text-xs font-semibold text-navy-700">วันที่</label>
                        <input type="date" id="attendance-date" class="w-full bg-transparent border-2 border-gray-200 rounded-2xl p-3.5 text-gray-700 focus:border-gold-500 focus:ring-0 outline-none transition-colors" required>
                    </div>
                    <div id="period-container" class="relative">
                        <label class="absolute -top-2.5 left-4 bg-white px-2 text-xs font-semibold text-navy-700">คาบเรียนที่</label>
                        <select id="attendance-period" class="w-full bg-transparent border-2 border-gray-200 rounded-2xl p-3.5 text-gray-700 focus:border-gold-500 focus:ring-0 outline-none transition-colors appearance-none" required>
                            <option value="">-- เลือกคาบ --</option>
                            <option value="1">คาบ 1</option><option value="2">คาบ 2</option>
                            <option value="3">คาบ 3</option><option value="4">คาบ 4</option>
                            <option value="5">คาบ 5</option><option value="6">คาบ 6</option>
                            <option value="7">คาบ 7</option><option value="8">คาบ 8</option>
                        </select>
                    </div>
                    <div class="relative">
                        <label class="absolute -top-2.5 left-4 bg-white px-2 text-xs font-semibold text-navy-700">รายวิชา</label>
                        <select id="subject-select" class="w-full bg-transparent border-2 border-gray-200 rounded-2xl p-3.5 text-gray-700 focus:border-gold-500 focus:ring-0 outline-none transition-colors appearance-none" required>
                            <option value="">-- เลือกรายวิชา --</option>
                        </select>
                    </div>
                </div>

                <!-- แท็บที่ 1: รายชื่อนักเรียน (ฟอร์มเช็คชื่อ) -->
                <div id="view-attendance" class="block">
                    <div id="student-list-container" class="hidden">
                        <div class="flex justify-between items-center mb-5 px-2">
                            <h2 class="text-xl font-bold text-navy-900">รายชื่อนักเรียน <span id="room-display" class="text-gold-500 font-medium text-lg"></span></h2>
                            <!-- ปุ่มมาเรียนทุกคน โทนสีทอง -->
                            <button id="mark-all-present-btn" class="flex items-center gap-1.5 text-sm bg-gold-50 hover:bg-gold-100 text-gold-600 py-2 px-4 rounded-xl transition-colors font-semibold border border-gold-200 active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                                มาทุกคน
                            </button>
                        </div>
                        
                        <!-- Card Layout สำหรับมือถือโดยเฉพาะ -->
                        <div id="student-cards-container" class="space-y-4">
                            <!-- รายชื่อนักเรียนจะถูกสร้างด้วย JS -->
                        </div>

                        <div class="mt-10">
                            <button id="submit-btn" class="w-full bg-navy-800 hover:bg-navy-900 text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-navy-900/20 transition-all duration-200 text-lg flex justify-center items-center gap-2 active:scale-95">
                                <span>บันทึกการเช็คชื่อ</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- แท็บที่ 2: หน้าสรุป -->
                <div id="view-summary" class="hidden">
                    <div id="summary-container" class="hidden">
                        <h2 class="text-xl font-bold text-navy-900 mb-5 px-2">สถิติการเข้าเรียน <span id="summary-room-display" class="text-gold-500 font-medium text-lg"></span></h2>
                        <div class="overflow-hidden bg-white border border-gray-100 rounded-2xl shadow-sm">
                            <div class="overflow-x-auto no-scrollbar">
                                <table class="min-w-full divide-y divide-gray-100 text-sm">
                                    <thead class="bg-navy-50">
                                        <tr>
                                            <th class="px-5 py-4 text-left font-semibold text-navy-800">รหัส</th>
                                            <th class="px-5 py-4 text-left font-semibold text-navy-800">ชื่อ-สกุล</th>
                                            <th class="px-3 py-4 text-center font-semibold text-green-600">มา</th>
                                            <th class="px-3 py-4 text-center font-semibold text-red-500">ขาด</th>
                                            <th class="px-3 py-4 text-center font-semibold text-gold-500">ลา</th>
                                            <th class="px-3 py-4 text-center font-semibold text-orange-500">สาย</th>
                                        </tr>
                                    </thead>
                                    <tbody id="summary-table-body" class="divide-y divide-gray-50">
                                        <!-- สรุปจะแสดงที่นี่ -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div id="loading-summary" class="hidden flex-col items-center justify-center py-12">
                        <div class="loader mb-4"></div>
                        <p class="text-sm font-medium text-navy-700">กำลังดึงข้อมูลสถิติ...</p>
                    </div>
                </div>
                
                <!-- แจ้งเตือนเมื่อไม่พบนักเรียน -->
                <div id="no-student-alert" class="hidden text-center py-10 text-gray-500 bg-gray-50 rounded-2xl mt-4 border border-dashed border-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                    <p>กรุณาเลือกรายวิชาที่ต้องการตรวจสอบ</p>
                </div>
            </div>
        </div>
    </div>

    <!-- แจ้งเตือน Popup (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 opacity-0 transition-all duration-300 text-white px-6 py-3.5 rounded-2xl shadow-xl z-50 font-medium flex items-center gap-2 w-max max-w-[90vw]">
        <span id="toast-icon"></span>
        <span id="toast-msg"></span>
    </div>

    <script>
        // =========================================================================
        // ⚠️ นำ URL จาก Google Apps Script มาใส่ที่นี่
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxft_a6QFLAu5GXeLfFyuyAHvm4CuLIh3rP3uJNEer3YwBgdTGEZWtBh4rkjpxVMJRZvA/exec';
        // =========================================================================

        let allSubjects = [];
        let allStudents = [];
        let currentMode = 'attendance';

        // ตั้งค่าวันที่ปัจจุบัน
        document.getElementById('attendance-date').valueAsDate = new Date();

        window.onload = async function() {
            try {
                const response = await fetch(GAS_URL, { method: 'GET', redirect: 'follow' });
                const data = await response.json();
                
                if(data.status === 'success') {
                    allSubjects = data.subjects;
                    allStudents = data.students;
                    populateSubjects();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading data:', error);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบฐานข้อมูล');
            }
        };

        function populateSubjects() {
            const select = document.getElementById('subject-select');
            allSubjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub.subject_id;
                option.textContent = `${sub.subject_id} - ${sub.subject_name}`;
                option.dataset.room = sub.target_room; 
                select.appendChild(option);
            });
        }

        document.getElementById('tab-attendance').addEventListener('click', () => switchTab('attendance'));
        document.getElementById('tab-summary').addEventListener('click', () => switchTab('summary'));

        function switchTab(mode) {
            currentMode = mode;
            const tabAtt = document.getElementById('tab-attendance');
            const tabSum = document.getElementById('tab-summary');
            const viewAtt = document.getElementById('view-attendance');
            const viewSum = document.getElementById('view-summary');
            
            document.getElementById('date-container').style.display = mode === 'summary' ? 'none' : 'block';
            document.getElementById('period-container').style.display = mode === 'summary' ? 'none' : 'block';

            if (mode === 'attendance') {
                tabAtt.className = "flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl bg-white text-navy-800 shadow-sm transition-all";
                tabSum.className = "flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl text-gray-400 hover:text-navy-700 transition-all";
                viewAtt.classList.remove('hidden');
                viewSum.classList.add('hidden');
                renderStudentsForAttendance();
            } else {
                tabSum.className = "flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl bg-white text-navy-800 shadow-sm transition-all";
                tabAtt.className = "flex-1 py-3 text-center text-sm md:text-base font-semibold rounded-xl text-gray-400 hover:text-navy-700 transition-all";
                viewSum.classList.remove('hidden');
                viewAtt.classList.add('hidden');
                fetchSummary();
            }
        }

        document.getElementById('subject-select').addEventListener('change', function() {
            if(currentMode === 'attendance') {
                renderStudentsForAttendance();
            } else {
                fetchSummary();
            }
        });

        function renderStudentsForAttendance() {
            const select = document.getElementById('subject-select');
            if(!select.value) {
                document.getElementById('student-list-container').classList.add('hidden');
                document.getElementById('no-student-alert').classList.remove('hidden');
                return;
            }

            const targetRoom = select.options[select.selectedIndex].dataset.room;
            const filteredStudents = allStudents.filter(student => student.room === targetRoom);
            const container = document.getElementById('student-cards-container');
            container.innerHTML = '';

            if(filteredStudents.length > 0) {
                document.getElementById('room-display').textContent = `(ม.${targetRoom})`;
                
                filteredStudents.forEach((student, index) => {
                    const card = document.createElement('div');
                    // ใส่ transition เพื่อความนุ่มนวลเวลาไฮไลท์สีแดงตอนแจ้งเตือน
                    card.className = "student-row bg-white border border-gray-100 shadow-sm p-4 rounded-2xl transition-all duration-300";
                    card.dataset.studentid = student.student_id;
                    
                    // ส่วนชื่อนักเรียน
                    const nameDiv = `
                        <div class="flex items-center gap-3 mb-3">
                            <div class="bg-navy-50 text-navy-800 font-bold w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0">
                                ${index+1}
                            </div>
                            <div class="flex-1">
                                <p class="text-base font-semibold text-gray-800">${student.name}</p>
                                <p class="text-xs text-gray-400 font-medium">รหัส: ${student.student_id}</p>
                            </div>
                        </div>
                    `;

                    // ส่วนปุ่มสถานะ (เรียงแบบ Grid 4 ช่องเพื่อมือถือ และ *เอา checked ออก*)
                    const statusDiv = `
                        <div class="grid grid-cols-4 gap-2 w-full">
                            <label class="cursor-pointer">
                                <input type="radio" name="status_${student.student_id}" value="มา" class="peer status-radio-present">
                                <div class="text-center py-2.5 text-sm font-semibold rounded-xl text-gray-500 bg-gray-50 border border-gray-100 peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500 peer-checked:shadow-md transition-all active:scale-95">มา</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="status_${student.student_id}" value="ขาด" class="peer">
                                <div class="text-center py-2.5 text-sm font-semibold rounded-xl text-gray-500 bg-gray-50 border border-gray-100 peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 peer-checked:shadow-md transition-all active:scale-95">ขาด</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="status_${student.student_id}" value="ลา" class="peer">
                                <div class="text-center py-2.5 text-sm font-semibold rounded-xl text-gray-500 bg-gray-50 border border-gray-100 peer-checked:bg-gold-500 peer-checked:text-white peer-checked:border-gold-500 peer-checked:shadow-md transition-all active:scale-95">ลา</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="status_${student.student_id}" value="สาย" class="peer">
                                <div class="text-center py-2.5 text-sm font-semibold rounded-xl text-gray-500 bg-gray-50 border border-gray-100 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 peer-checked:shadow-md transition-all active:scale-95">สาย</div>
                            </label>
                        </div>
                    `;
                    
                    card.innerHTML = nameDiv + statusDiv;
                    
                    // เมื่อกดเลือกสถานะ ให้ลบกรอบสีแดง(error)ออก
                    card.addEventListener('change', function() {
                        this.classList.remove('border-red-400', 'bg-red-50');
                        this.classList.add('border-gray-100', 'bg-white');
                    });

                    container.appendChild(card);
                });
                
                document.getElementById('no-student-alert').classList.add('hidden');
                document.getElementById('student-list-container').classList.remove('hidden');
            } else {
                document.getElementById('student-list-container').classList.add('hidden');
                document.getElementById('no-student-alert').classList.remove('hidden');
            }
        }

        // ปุ่มเลือกมาเรียนทุกคน
        document.getElementById('mark-all-present-btn').addEventListener('click', function() {
            const presents = document.querySelectorAll('.status-radio-present');
            presents.forEach(radio => {
                radio.checked = true;
                // ล้าง error อัตโนมัติเมื่อกดมาเรียนทุกคน
                const card = radio.closest('.student-row');
                card.classList.remove('border-red-400', 'bg-red-50');
                card.classList.add('border-gray-100', 'bg-white');
            });
            showToast('เลือกสถานะ "มา" ให้ทุกคนแล้ว', 'success');
        });

        async function fetchSummary() {
            const select = document.getElementById('subject-select');
            const summaryContainer = document.getElementById('summary-container');
            const loadingSummary = document.getElementById('loading-summary');
            
            if(!select.value) {
                summaryContainer.classList.add('hidden');
                document.getElementById('no-student-alert').classList.remove('hidden');
                return;
            }

            const subjectId = select.value;
            const targetRoom = select.options[select.selectedIndex].dataset.room;
            
            document.getElementById('no-student-alert').classList.add('hidden');
            summaryContainer.classList.add('hidden');
            loadingSummary.classList.remove('hidden');
            loadingSummary.classList.add('flex');

            try {
                const response = await fetch(`${GAS_URL}?action=summary&subject_id=${subjectId}`, { redirect: 'follow' });
                const data = await response.json();
                
                if(data.status === 'success') {
                    renderSummary(data.summary, targetRoom);
                }
            } catch (error) {
                console.error("Summary error:", error);
                showToast('ดึงข้อมูลสรุปไม่สำเร็จ', 'error');
            } finally {
                loadingSummary.classList.add('hidden');
                loadingSummary.classList.remove('flex');
            }
        }

        function renderSummary(summaryData, targetRoom) {
            const filteredStudents = allStudents.filter(student => student.room === targetRoom);
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';
            
            if(filteredStudents.length > 0) {
                document.getElementById('summary-room-display').textContent = `(ม.${targetRoom})`;
                document.getElementById('summary-container').classList.remove('hidden');
                
                filteredStudents.forEach(student => {
                    const stats = summaryData[student.student_id] || { "มา": 0, "ขาด": 0, "ลา": 0, "สาย": 0 };
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-navy-50/50 transition-colors";
                    tr.innerHTML = `
                        <td class="px-5 py-4 text-xs text-gray-500 whitespace-nowrap">${student.student_id}</td>
                        <td class="px-5 py-4 text-sm font-medium text-gray-800 whitespace-nowrap">${student.name}</td>
                        <td class="px-3 py-4 text-center text-sm font-bold text-green-600">${stats["มา"] || 0}</td>
                        <td class="px-3 py-4 text-center text-sm font-bold text-red-500">${stats["ขาด"] || 0}</td>
                        <td class="px-3 py-4 text-center text-sm font-bold text-gold-500">${stats["ลา"] || 0}</td>
                        <td class="px-3 py-4 text-center text-sm font-bold text-orange-500">${stats["สาย"] || 0}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                document.getElementById('no-student-alert').classList.remove('hidden');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');
            
            msg.textContent = message;
            
            if (type === 'success') {
                toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 transition-all duration-300 text-white px-6 py-3.5 rounded-full shadow-2xl shadow-green-500/30 z-50 font-medium flex items-center gap-2 w-max max-w-[90vw] bg-green-500`;
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
            } else {
                toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 transition-all duration-300 text-white px-6 py-3.5 rounded-full shadow-2xl shadow-red-500/30 z-50 font-medium flex items-center gap-2 w-max max-w-[90vw] bg-red-500`;
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
            }
            
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => { 
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0'); 
            }, 3000);
        }

        document.getElementById('submit-btn').addEventListener('click', async function() {
            const date = document.getElementById('attendance-date').value;
            const period = document.getElementById('attendance-period').value;
            const subjectId = document.getElementById('subject-select').value;
            
            if(!date || !period || !subjectId) {
                showToast('กรุณากรอก วันที่, คาบเรียน และรายวิชาให้ครบ', 'error');
                return;
            }

            const btn = this;
            const originalText = btn.innerHTML;
            
            const records = [];
            let hasMissing = false;

            // ตรวจสอบว่าเช็คชื่อครบทุกคนหรือไม่
            document.querySelectorAll('.student-row').forEach(row => {
                const studentId = row.dataset.studentid;
                const statusElement = document.querySelector(`input[name="status_${studentId}"]:checked`);
                
                if (!statusElement) {
                    hasMissing = true;
                    // ไฮไลท์คนที่ยังไม่ได้เช็คชื่อด้วยกรอบสีแดงอ่อน
                    row.classList.remove('border-gray-100', 'bg-white');
                    row.classList.add('border-red-400', 'bg-red-50');
                } else {
                    records.push({
                        date: date, period: period, subject_id: subjectId,
                        student_id: studentId, status: statusElement.value
                    });
                }
            });

            if (hasMissing) {
                showToast('กรุณาเช็คชื่อให้ครบทุกคน!', 'error');
                return;
            }

            // ถ่าครบแล้ว เริ่มโหลด
            btn.innerHTML = '<span class="loader inline-block w-5 h-5 border-[3px] mr-2 border-t-white"></span> กำลังบันทึก...';
            btn.disabled = true;
            btn.classList.add('opacity-80');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST', redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ records: records })
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    showToast('บันทึกข้อมูลเรียบร้อยแล้ว!');
                    document.getElementById('subject-select').value = "";
                    document.getElementById('student-list-container').classList.add('hidden');
                } else {
                    showToast('ข้อผิดพลาด: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการส่งข้อมูล', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
            }
        });
    </script>
</body>
</html>
