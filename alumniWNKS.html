<script>
    // ********* ใส่ URL Apps Script ของคุณที่นี่ *********
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzr6lNlla9qAKsJafCdJZrTUt9Jz_FGGFyiN2vQfCfCf3XkZcVxB5tbcM3IJY5EbnVRNg/exec";
    // ****************************************************

    let allGenerations = [];
    // สร้างที่เก็บแคช เพื่อให้โหลดรุ่นที่เคยดูแล้วได้ไวขึ้น
    let cachedData = {}; 
    let currentFilterGen = ""; 
    let currentlyDisplayedData = [];

    window.onload = () => {
      initApp();
    };

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.className = ''; 
        toast.classList.add('show', type);
        toast.innerHTML = type === 'success' ? `✅ ${message}` : `❌ ${message}`;
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // 🚀 เพิ่มประสิทธิภาพการบีบอัดรูปภาพ (บีบหนักขึ้น รองรับรูประดับ 4K ได้สบาย)
    function compressImage(file, maxWidth = 600) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; 
            let height = img.height;
            // บีบให้ความกว้างเหลือแค่ 600px เพื่อลดภาระเซิร์ฟเวอร์
            if (width > maxWidth) { 
                height = Math.round((maxWidth / width) * height); 
                width = maxWidth; 
            }
            canvas.width = width; 
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            // ลด Quality เหลือ 60% (0.6) ทำให้ไฟล์เหลือแค่ประมาณ 50-100KB
            resolve(canvas.toDataURL('image/jpeg', 0.6)); 
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function initApp() {
      showLoader(true, "กำลังโหลดรายชื่อรุ่น...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getGenerations" })
        });
        const result = await res.json();
        
        if (result.status === "success") {
          allGenerations = result.data;
          renderGenButtons(allGenerations);
          populateGenSelect(allGenerations);
          
          if(allGenerations.length > 0) {
             // โหลดข้อมูลรุ่นแรกอัตโนมัติ
             filterByGen(allGenerations[0]); 
          }
        }
      } catch (err) { 
          showToast("ไม่สามารถเชื่อมต่อฐานข้อมูลได้", "error");
          showLoader(false);
      } 
    }

    function renderGenButtons(genList) {
      const container = document.getElementById('genList');
      container.innerHTML = '';
      genList.forEach((gen, index) => {
        container.innerHTML += `<button class="gen-btn ${index === 0 ? 'active' : ''}" onclick="filterByGen('${gen}', this)">${gen}</button>`;
      });
    }

    function populateGenSelect(genList) {
      const select = document.getElementById('formGen');
      select.innerHTML = '<option value="">เลือกรุ่น...</option>' + genList.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    async function searchData() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return showToast("กรุณาพิมพ์คำค้นหา", "error");
      
      document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
      
      showLoader(true, "กำลังค้นหาข้อมูลจากทุกรุ่น...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "search", query: q })
        });
        const result = await res.json();
        renderCards(result.data || []);
      } catch (err) { 
          showToast("เกิดข้อผิดพลาดในการค้นหา", "error");
          showLoader(false);
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchData();
    });

    // 🚀 ระบบดึงข้อมูลแบบ Smart Cache (จำรุ่นที่เคยเปิดแล้ว)
    async function filterByGen(genName, btn = null) {
      currentFilterGen = genName;
      
      if(btn) {
          document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
      }

      // ถ้าเคยโหลดรุ่นนี้มาแล้ว ให้ดึงจากความจำเครื่องเลย (เร็ว 0 วิ)
      if (cachedData[genName]) {
          renderCards(cachedData[genName]);
          return;
      }

      // ถ้ายังไม่เคยโหลด ให้ดึงจาก Google Sheet
      showLoader(true, `กำลังโหลดข้อมูล ${genName}...`);
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getByGen", generation: genName })
        });
        const result = await res.json();
        
        if(result.status === "success") {
           cachedData[genName] = result.data; // จำใส่แคชไว้
           renderCards(result.data);
        }
      } catch (err) { 
          showToast(`เกิดข้อผิดพลาดในการดึงข้อมูล ${genName}`, "error");
          showLoader(false);
      }
    }

    function renderCards(data) {
      const container = document.getElementById('alumniContainer');
      currentlyDisplayedData = data; 
      
      if (data.length === 0) {
        container.innerHTML = `<div class="empty-state">❌ ไม่พบข้อมูลศิษย์เก่า</div>`;
        return;
      }
      
      container.innerHTML = data.map((item, index) => `
        <div class="alumni-card">
          <img src="${item.imageUrl}" class="profile-img" loading="lazy" onerror="this.src='https://via.placeholder.com/150/1E3E62/FFFFFF?text=No+Photo'">
          <div class="alumni-name">${item.prefix}${item.fname} ${item.lname}</div>
          <div class="alumni-id">รหัส: ${item.studentId}</div>
          
          <div class="info-group">
              <div><span>ชื่อเล่น:</span> <span>${item.nickname || '-'}</span></div>
              <div><span>เบอร์โทร:</span> <span>${item.phone || '-'}</span></div>
              <div><span>LINE ID:</span> <span>${item.lineId || '-'}</span></div>
          </div>
          <span class="alumni-tag">${item.sheetName}</span>
          
          <div class="card-actions">
            <button class="btn btn-edit" onclick='editItem(${index})'>แก้ไขข้อมูล</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('alumniForm').onsubmit = async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerText;
      submitBtn.innerText = 'กำลังบันทึกและอัปเดต...';
      submitBtn.disabled = true;

      const fileInput = document.getElementById('formImage');
      let base64String = "";
      
      try {
          if (fileInput.files.length > 0) {
            // บีบอัดรูปก่อนส่ง ป้องกันแอปค้าง
            base64String = await compressImage(fileInput.files[0]);
          }

          const payload = {
            action: "save",
            data: {
              generation: document.getElementById('formGen').value,
              studentId: document.getElementById('formStudentId').value,
              prefix: document.getElementById('formPrefix').value,
              fname: document.getElementById('formFname').value,
              lname: document.getElementById('formLname').value,
              nickname: document.getElementById('formNickname').value,
              phone: document.getElementById('formPhone').value,
              lineId: document.getElementById('formLineId').value,
              imageBase64: base64String,
              rowIndex: document.getElementById('editRowIndex').value,
              sheetName: document.getElementById('editSheetName').value || document.getElementById('formGen').value,
              imageUrl: document.getElementById('editRowIndex').value ? currentlyDisplayedData.find(d => d.studentId === document.getElementById('formStudentId').value)?.imageUrl : ""
            }
          };

          const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
          const result = await res.json();
          
          if(result.status === 'success') {
              showToast('บันทึกข้อมูลเรียบร้อยแล้ว!');
              closeModal();
              
              const savedData = result.data;
              const gen = savedData.sheetName;
              
              // ล้างแคชของรุ่นนี้ เพื่อให้ระบบดึงข้อมูลล่าสุดจาก Sheet เมื่อมีการแก้ไข
              if(cachedData[gen]) {
                 delete cachedData[gen];
              }
              
              // ถ้ารุ่นที่เพิ่งเพิ่มไม่มีในปุ่ม ให้โหลดเว็บใหม่
              if(!allGenerations.includes(gen)) {
                  initApp();
              } else {
                  // โหลดข้อมูลรุ่นที่เพิ่งบันทึกมาแสดง
                  filterByGen(gen);
                  document.querySelectorAll('.gen-btn').forEach(b => {
                      if(b.innerText === gen) b.classList.add('active');
                  });
              }
          } else {
               showToast('เกิดข้อผิดพลาด: ' + result.message, "error");
          }
      } catch (err) { 
          showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ (ขนาดไฟล์อาจยังใหญ่เกินไป)', "error");
      } finally {
          submitBtn.innerText = originalBtnText;
          submitBtn.disabled = false;
      }
    };

    function editItem(index) {
      const item = currentlyDisplayedData[index];
      document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลศิษย์เก่า';
      
      document.getElementById('editRowIndex').value = item.rowIndex;
      document.getElementById('editSheetName').value = item.sheetName;
      document.getElementById('formGen').value = item.sheetName;
      document.getElementById('formStudentId').value = item.studentId;
      document.getElementById('formPrefix').value = item.prefix.trim();
      document.getElementById('formFname').value = item.fname;
      document.getElementById('formLname').value = item.lname;
      document.getElementById('formNickname').value = item.nickname !== '-' ? item.nickname : '';
      document.getElementById('formPhone').value = item.phone !== '-' ? item.phone : '';
      document.getElementById('formLineId').value = item.lineId !== '-' ? item.lineId : '';
      
      document.getElementById('formGen').disabled = true;
      document.getElementById('formStudentId').readOnly = true;
      document.getElementById('formStudentId').style.opacity = '0.7';
      
      openModal();
    }

    function openModal() { 
        const modal = document.getElementById('crudModal');
        modal.classList.add('show');
        
        if(!document.getElementById('editRowIndex').value) {
            document.getElementById('modalTitle').innerText = 'เพิ่มข้อมูลศิษย์เก่าใหม่';
            document.getElementById('formGen').disabled = false;
            document.getElementById('formStudentId').readOnly = false;
            document.getElementById('formStudentId').style.opacity = '1';
            
            if(currentFilterGen) {
                document.getElementById('formGen').value = currentFilterGen;
            }
        }
    }
    
    function closeModal() {
      const modal = document.getElementById('crudModal');
      modal.classList.remove('show');
      setTimeout(() => {
        document.getElementById('alumniForm').reset();
        document.getElementById('editRowIndex').value = '';
        document.getElementById('editSheetName').value = '';
      }, 300);
    }

    function closeModalOutside(event) {
        const modalContent = document.getElementById('modalContent');
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
    
    function showLoader(show, text="กำลังประมวลผลข้อมูล...") { 
      const container = document.getElementById('alumniContainer');
      const loader = document.getElementById('loader');
      
      if (show) {
         container.innerHTML = '';
         loader.querySelector('div:last-child').innerText = text;
         container.appendChild(loader);
         loader.style.display = 'block';
      } else {
         loader.style.display = 'none';
      }
    }
</script>
