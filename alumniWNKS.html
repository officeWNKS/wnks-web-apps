<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฐานข้อมูลศิษย์เก่า - วังน้ำคู่ศึกษา</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-navy-dark: #0B192C;
      --bg-navy-light: #1E3E62;
      --yellow-gold: #FFD700;
      --yellow-gold-hover: #FFC107;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --glass-blur: blur(16px);
    }

    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, var(--bg-navy-dark) 0%, var(--bg-navy-light) 100%);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Splash Screen Animation --- */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-navy-dark); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash-screen.hidden { opacity: 0; visibility: hidden; }
    
    .splash-logo { width: 80px; height: 80px; margin-bottom: 20px; position: relative; }
    .splash-logo::before, .splash-logo::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%; border: 4px solid transparent;
    }
    .splash-logo::before { border-top-color: var(--yellow-gold); border-bottom-color: var(--yellow-gold); animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
    .splash-logo::after { border-left-color: #fff; border-right-color: #fff; animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse; }
    
    .splash-text { font-size: 1.5rem; font-weight: 600; color: var(--yellow-gold); letter-spacing: 2px; animation: pulse 1.5s ease-in-out infinite; }
    .splash-subtext { font-size: 0.9rem; color: var(--text-muted); margin-top: 10px; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.98); } }

    /* Background Blobs */
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none; opacity: 0.5; }
    .blob-1 { width: 400px; height: 400px; background: rgba(255, 215, 0, 0.15); top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: rgba(30, 62, 98, 0.6); bottom: -150px; right: -150px; }

    .container { width: 100%; max-width: 1200px; padding: 30px 20px; position: relative; z-index: 1; }

    header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.8s ease forwards; }
    header h1 { font-size: 2.5rem; color: var(--yellow-gold); font-weight: 600; text-shadow: 0 2px 15px rgba(255, 215, 0, 0.2); }
    header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 5px; }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-panel {
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
      border-radius: 24px; box-shadow: var(--glass-shadow); padding: 30px; margin-bottom: 30px;
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .search-box { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }

    input[type="text"], input[type="tel"], select {
      padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25); color: var(--text-main); font-size: 1rem;
      outline: none; transition: all 0.3s ease; width: 100%;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.4); }
    input:focus, select:focus { border-color: var(--yellow-gold); background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15); transform: translateY(-2px); }
    select option { background: var(--bg-navy-dark); color: white; }

    .search-input-wrapper { flex: 1; min-width: 280px; max-width: 500px; display: flex; }
    .search-input-wrapper input { border-radius: 12px 0 0 12px; }
    
    .btn {
      padding: 14px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 500; font-size: 1rem;
      transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .btn::after { content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; background: rgba(255,255,255,0.5); opacity: 0; border-radius: 100%; transform: scale(1, 1) translate(-50%); transform-origin: 50% 50%; }
    .btn:active::after { animation: ripple 0.6s ease-out; }
    @keyframes ripple {
      0% { transform: scale(0, 0); opacity: 0.5; }
      100% { transform: scale(20, 20); opacity: 0; }
    }

    .btn-gold { background: var(--yellow-gold); color: var(--bg-navy-dark); font-weight: 600; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); }
    .btn-gold:hover { background: var(--yellow-gold-hover); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3); }
    .btn-search { border-radius: 0 12px 12px 0; margin-left: -1px; }
    .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); backdrop-filter: blur(5px); }
    .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--yellow-gold); color: var(--yellow-gold); transform: translateY(-2px); }

    .filter-section { text-align: center; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
    .filter-label { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; display: block; }
    .dropdown-wrapper { max-width: 300px; margin: 0 auto; position: relative; }
    .gen-dropdown {
      appearance: none; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--yellow-gold);
      color: var(--yellow-gold); padding: 12px 20px; border-radius: 12px;
      font-size: 1.05rem; font-weight: 600; cursor: pointer; text-align: center;
      transition: 0.3s; width: 100%;
    }
    .gen-dropdown:hover { box-shadow: 0 0 15px rgba(255,215,0,0.2); transform: translateY(-2px); }
    .dropdown-wrapper::after {
      content: '▼'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      color: var(--yellow-gold); pointer-events: none; font-size: 0.8rem;
    }

    .alumni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; perspective: 1000px; }
    
    .alumni-card {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 25px 20px; text-align: center; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0; transform: translateY(30px); animation: fadeInUp 0.6s ease forwards;
    }
    .alumni-card:hover { transform: translateY(-10px) scale(1.02); border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 15px 35px rgba(0,0,0,0.4); background: rgba(255, 255, 255, 0.08); }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* สไตล์ไอคอนแทนรูปภาพ */
    .avatar-icon {
      width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
      border: 2px solid rgba(255,215,0,0.3); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: var(--yellow-gold); font-weight: 600; text-transform: uppercase; transition: 0.3s;
    }
    .alumni-card:hover .avatar-icon { transform: scale(1.1) rotate(5deg); border-color: var(--yellow-gold); background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
    
    .alumni-name { font-size: 1.3rem; font-weight: 500; color: var(--text-main); margin-bottom: 5px; }
    .alumni-id { color: var(--yellow-gold); font-size: 0.95rem; font-weight: 600; margin-bottom: 15px; }
    
    .info-group {
      background: rgba(0,0,0,0.25); border-radius: 12px; padding: 15px; margin-bottom: 15px;
      font-size: 0.85rem; color: var(--text-muted); text-align: left; border: 1px solid rgba(255,255,255,0.05);
    }
    .info-group div { margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
    .info-group div:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .info-group span:first-child { color: rgba(255,255,255,0.6); }
    .info-group span:last-child { color: var(--text-main); font-weight: 400; text-align: right; }

    .alumni-tag { display: inline-block; background: rgba(255, 215, 0, 0.15); color: var(--yellow-gold); padding: 6px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; border: 1px solid rgba(255,215,0,0.2); }
    
    .card-actions { margin-top: 20px; }
    .btn-edit { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--glass-border); width: 100%; border-radius: 10px; padding: 12px; transition: 0.3s; }
    .btn-edit:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--text-main); }

    /* Modal Form */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); z-index: 100;
      justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.4s ease;
    }
    .modal.show { display: flex; opacity: 1; }
    .modal-content {
      background: linear-gradient(145deg, #1A365D 0%, #0B192C 100%); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; width: 100%; max-width: 600px; padding: 40px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6); transform: scale(0.9) translateY(30px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;
    }
    .modal.show .modal-content { transform: scale(1) translateY(0); opacity: 1; }
    .modal-content::-webkit-scrollbar { width: 8px; }
    .modal-content::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }
    .modal-content::-webkit-scrollbar-thumb:hover { background: rgba(255,215,0,0.6); }
    
    .modal-header { margin-bottom: 30px; text-align: center; position: relative; }
    .modal-header h3 { color: var(--yellow-gold); font-size: 1.8rem; font-weight: 600; text-shadow: 0 2px 10px rgba(255,215,0,0.2); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.95rem; margin-bottom: 8px; color: var(--text-muted); padding-left: 5px; font-weight: 400; }
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    
    .modal-actions { display: flex; gap: 15px; margin-top: 35px; }
    .modal-actions .btn { flex: 1; padding: 16px; font-size: 1.1rem; }

    /* Loader Spinner */
    .loading-wrapper { display: none; text-align: center; padding: 60px 20px; grid-column: 1/-1; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,215,0,0.1); border-top: 4px solid var(--yellow-gold); border-radius: 50%; animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; margin: 0 auto 20px; }
    .loading-text { color: var(--yellow-gold); font-weight: 500; font-size: 1.1rem; letter-spacing: 1px; animation: pulse 1.5s infinite; }
    
    .empty-state { grid-column: 1/-1; text-align:center; color: rgba(255,255,255,0.5); padding: 60px 20px; font-size: 1.2rem; background: rgba(0,0,0,0.2); border-radius: 20px; border: 1px dashed rgba(255,255,255,0.1); }

    /* Toast Notification */
    #toast {
      position: fixed; top: 20px; right: 20px; color: #fff; padding: 16px 30px;
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 1000;
      transform: translateX(120%) scale(0.9); opacity: 0; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); font-weight: 500; display: flex; align-items: center; gap: 12px; font-size: 1.05rem;
    }
    #toast.show { transform: translateX(0) scale(1); opacity: 1; }
    #toast.success { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    #toast.error { background: linear-gradient(135deg, #e74c3c, #c0392b); }

    @media (max-width: 600px) {
      .search-input-wrapper { min-width: 100%; }
      .search-input-wrapper input { border-radius: 12px; margin-bottom: 10px; }
      .btn-search { border-radius: 12px; width: 100%; margin-left: 0; }
      .search-box { flex-direction: column; }
      .btn-outline { width: 100%; }
      .form-row { flex-direction: column; gap: 0; }
      .modal-content { padding: 25px; }
    }
  </style>
</head>
<body>
  
  <div id="splash-screen">
    <div class="splash-logo"></div>
    <div class="splash-text">ระบบศิษย์เก่า</div>
    <div class="splash-subtext">กำลังเตรียมพร้อมฐานข้อมูล...</div>
  </div>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div id="toast"></div>

  <div class="container">
    <header>
      <h1>ข้อมูลศิษย์เก่า</h1>
      <p>โรงเรียนวังน้ำคู่ศึกษา</p>
    </header>

    <div class="glass-panel controls-container">
      <div class="search-box">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="พิมพ์รหัสนักเรียน หรือ ชื่อ-นามสกุล...">
          <button class="btn btn-gold btn-search" onclick="searchData()">ค้นหา</button>
        </div>
        <button class="btn btn-outline" onclick="openModal()">+ เพิ่มข้อมูลศิษย์เก่า</button>
      </div>

      <div class="filter-section">
        <span class="filter-label">เลือกดูตามรุ่น:</span>
        <div class="dropdown-wrapper">
          <select id="mainGenSelect" class="gen-dropdown" onchange="filterByGen(this.value)">
            <option value="">กำลังโหลดรายชื่อรุ่น...</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results Display -->
    <div class="alumni-grid" id="alumniContainer">
        <!-- Loader -->
        <div class="loading-wrapper" id="loader">
            <div class="spinner"></div>
            <div class="loading-text">กำลังประมวลผลข้อมูล...</div>
        </div>
    </div>
  </div>

  <!-- Modal Form -->
  <div class="modal" id="crudModal" onclick="closeModalOutside(event)">
    <div class="modal-content" id="modalContent">
      <div class="modal-header">
        <h3 id="modalTitle">เพิ่ม/แก้ไข ข้อมูล</h3>
      </div>
      
      <form id="alumniForm">
        <input type="hidden" id="editRowIndex">
        <input type="hidden" id="editSheetName">

        <div class="form-group">
          <label>เลือกรุ่น / แผ่นงาน *</label>
          <select id="formGen" required>
              <option value="">กำลังโหลดรุ่น...</option>
          </select>
        </div>
        
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label>รหัสนักเรียน *</label>
              <input type="text" id="formStudentId" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>คำนำหน้า</label>
                <select id="formPrefix">
                    <option value="">เลือก</option>
                    <option value="ด.ช.">ด.ช.</option>
                    <option value="ด.ญ.">ด.ญ.</option>
                    <option value="นาย">นาย</option>
                    <option value="นางสาว">นางสาว</option>
                    <option value="นาง">นาง</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
              <label>ชื่อ *</label>
              <input type="text" id="formFname" required>
            </div>
            <div class="form-group">
              <label>นามสกุล *</label>
              <input type="text" id="formLname" required>
            </div>
        </div>

        <div class="form-row">
             <div class="form-group">
              <label>ชื่อเล่น</label>
              <input type="text" id="formNickname">
            </div>
            <div class="form-group">
              <label>เบอร์โทรศัพท์</label>
              <input type="tel" id="formPhone">
            </div>
        </div>

        <div class="form-group">
          <label>LINE ID</label>
          <input type="text" id="formLineId">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" style="border-color: rgba(255,255,255,0.2);" onclick="closeModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-gold">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuvmD74_ZeYW2HTPe-If0JumxRTUBWmEkiDT5R6-mc6d5eI_wALLFSnzoq-uC9tzAyZg/exec";
    
    let allGenerations = [];
    let cachedData = {}; 
    let currentFilterGen = ""; 
    let currentlyDisplayedData = [];

    window.onload = () => {
      initApp();
    };

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.className = ''; 
        toast.classList.add('show', type);
        toast.innerHTML = type === 'success' ? `✅ ${message}` : `⚠️ ${message}`;
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    async function initApp() {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "getGenerations" })
        });
        const result = await res.json();
        
        if (result.status === "success") {
          allGenerations = result.data;
          populateGenDropdown(allGenerations); 
          populateGenSelect(allGenerations);   
          
          if(allGenerations.length > 0) {
             await filterByGen(allGenerations[0]); 
          }
        } else {
          showToast("เซิร์ฟเวอร์ขัดข้อง: " + result.message, "error");
          document.getElementById('mainGenSelect').innerHTML = `<option value="">❌ โหลดข้อมูลล้มเหลว</option>`;
        }
      } catch (err) { 
          showToast("ไม่สามารถเชื่อมต่อฐานข้อมูลได้", "error");
      } finally {
          setTimeout(() => {
              document.getElementById('splash-screen').classList.add('hidden');
          }, 600);
      } 
    }

    function populateGenDropdown(genList) {
      const select = document.getElementById('mainGenSelect');
      select.innerHTML = genList.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    function populateGenSelect(genList) {
      const select = document.getElementById('formGen');
      select.innerHTML = '<option value="">เลือกรุ่น...</option>' + genList.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    async function searchData() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return showToast("กรุณาพิมพ์คำค้นหา", "error");
      
      const mainSelect = document.getElementById('mainGenSelect');
      if(!mainSelect.querySelector('option[value="search_result"]')){
          mainSelect.innerHTML = `<option value="search_result" selected>--- ผลการค้นหา ---</option>` + mainSelect.innerHTML;
      }
      mainSelect.value = "search_result";

      showLoader(true, "กำลังค้นหาข้อมูล...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "search", query: q })
        });
        const result = await res.json();
        if(result.status === "success"){
            renderCards(result.data || []);
        } else {
            showToast(result.message, "error");
            showLoader(false);
        }
      } catch (err) { 
          showToast("เกิดข้อผิดพลาดในการค้นหา", "error");
          showLoader(false);
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchData();
    });

    // เพิ่ม Parameter forceRefresh เพื่อบังคับดึงข้อมูลจาก Sheet ใหม่โดยไม่สน Cache
    async function filterByGen(genName, forceRefresh = false) {
      if(genName === "search_result") return;
      currentFilterGen = genName;
      document.getElementById('mainGenSelect').value = genName;
      
      const searchOpt = document.querySelector('#mainGenSelect option[value="search_result"]');
      if(searchOpt) searchOpt.remove();

      // ถ้าไม่บังคับรีเฟรช และมีข้อมูลใน Cache ให้ใช้ Cache เลย (เร็วขึ้น)
      if (!forceRefresh && cachedData[genName]) {
          renderCards(cachedData[genName]);
          return;
      }

      showLoader(true, `กำลังโหลดข้อมูล ${genName}...`);
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getByGen", generation: genName })
        });
        const result = await res.json();
        
        if(result.status === "success") {
           cachedData[genName] = result.data; // อัปเดต Cache ใหม่
           renderCards(result.data);
        } else {
           showToast(result.message, "error");
           showLoader(false);
        }
      } catch (err) { 
          showToast(`เกิดข้อผิดพลาดในการดึงข้อมูล`, "error");
          showLoader(false);
      }
    }

    function renderCards(data) {
      const container = document.getElementById('alumniContainer');
      currentlyDisplayedData = data; 
      
      if (data.length === 0) {
        container.innerHTML = `<div class="empty-state">ไม่พบข้อมูลศิษย์เก่าในรุ่นนี้<br><span style="font-size: 0.9rem; opacity: 0.7;">คลิก + เพิ่มข้อมูล เพื่อเริ่มต้นบันทึก</span></div>`;
        return;
      }
      
      // สร้าง Avatar อัตโนมัติจากตัวอักษรตัวแรกของชื่อ
      container.innerHTML = data.map((item, index) => {
        const initial = item.fname ? item.fname.charAt(0) : '?';
        return `
        <div class="alumni-card" style="animation-delay: ${index * 0.05}s">
          <div class="avatar-icon">${initial}</div>
          <div class="alumni-name">${item.prefix}${item.fname} ${item.lname}</div>
          <div class="alumni-id">รหัส: ${item.studentId}</div>
          
          <div class="info-group">
              <div><span>ชื่อเล่น:</span> <span>${item.nickname || '-'}</span></div>
              <div><span>เบอร์โทร:</span> <span>${item.phone || '-'}</span></div>
              <div><span>LINE ID:</span> <span>${item.lineId || '-'}</span></div>
          </div>
          <span class="alumni-tag">${item.sheetName}</span>
          
          <div class="card-actions">
            <button class="btn btn-edit" onclick='editItem(${index})'>แก้ไขข้อมูล</button>
          </div>
        </div>
      `}).join('');
    }

    document.getElementById('alumniForm').onsubmit = async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerText;
      submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
      submitBtn.disabled = true;

      try {
          const payload = {
            action: "save",
            data: {
              generation: document.getElementById('formGen').value,
              studentId: document.getElementById('formStudentId').value,
              prefix: document.getElementById('formPrefix').value,
              fname: document.getElementById('formFname').value,
              lname: document.getElementById('formLname').value,
              nickname: document.getElementById('formNickname').value,
              phone: document.getElementById('formPhone').value,
              lineId: document.getElementById('formLineId').value,
              rowIndex: document.getElementById('editRowIndex').value,
              sheetName: document.getElementById('editSheetName').value || document.getElementById('formGen').value
            }
          };

          const res = await fetch(SCRIPT_URL, { 
              method: "POST", 
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload) 
          });
          
          const textRes = await res.text();
          let result;
          try {
             result = JSON.parse(textRes);
          } catch(e) {
             console.error("Parse Error:", textRes);
             throw new Error("เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ");
          }
          
          if(result.status === 'success') {
              showToast('บันทึกข้อมูลสำเร็จ!');
              closeModal();
              
              const gen = result.data.sheetName;
              
              // ตรวจสอบว่าเป็นรุ่นใหม่ที่ยังไม่เคยมีใน Dropdown หรือไม่
              if(!allGenerations.includes(gen)) {
                  allGenerations.push(gen); // เพิ่มรุ่นใหม่เข้าไปใน Array
                  populateGenDropdown(allGenerations); 
                  populateGenSelect(allGenerations);
              }

              // บังคับให้ไปที่แท็บของรุ่นที่เพิ่งแก้ไข และสั่งโหลดใหม่ (forceRefresh = true)
              await filterByGen(gen, true);

          } else {
               showToast(result.message, "error");
          }
      } catch (err) { 
          console.error("Submit Error:", err);
          showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', "error");
      } finally {
          submitBtn.innerText = originalBtnText;
          submitBtn.disabled = false;
      }
    };

    function editItem(index) {
      const item = currentlyDisplayedData[index];
      document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลศิษย์เก่า';
      
      document.getElementById('editRowIndex').value = item.rowIndex;
      document.getElementById('editSheetName').value = item.sheetName;
      document.getElementById('formGen').value = item.sheetName;
      document.getElementById('formStudentId').value = item.studentId;
      document.getElementById('formPrefix').value = item.prefix.trim();
      document.getElementById('formFname').value = item.fname;
      document.getElementById('formLname').value = item.lname;
      document.getElementById('formNickname').value = item.nickname !== '-' ? item.nickname : '';
      document.getElementById('formPhone').value = item.phone !== '-' ? item.phone : '';
      document.getElementById('formLineId').value = item.lineId !== '-' ? item.lineId : '';
      
      document.getElementById('formGen').disabled = true;
      document.getElementById('formStudentId').readOnly = true;
      document.getElementById('formStudentId').style.opacity = '0.5';
      
      openModal();
    }

    function openModal() { 
        const modal = document.getElementById('crudModal');
        modal.classList.add('show');
        
        if(!document.getElementById('editRowIndex').value) {
            document.getElementById('modalTitle').innerText = 'เพิ่มข้อมูลศิษย์เก่า';
            document.getElementById('formGen').disabled = false;
            document.getElementById('formStudentId').readOnly = false;
            document.getElementById('formStudentId').style.opacity = '1';
            
            if(currentFilterGen && currentFilterGen !== "search_result") {
                document.getElementById('formGen').value = currentFilterGen;
            }
        }
    }
    
    function closeModal() {
      const modal = document.getElementById('crudModal');
      modal.classList.remove('show');
      setTimeout(() => {
        document.getElementById('alumniForm').reset();
        document.getElementById('editRowIndex').value = '';
        document.getElementById('editSheetName').value = '';
      }, 400); // รอให้ Animation fade out เสร็จก่อนค่อยเคลียร์ฟอร์ม
    }

    function closeModalOutside(event) {
        const modalContent = document.getElementById('modalContent');
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
    
    function showLoader(show, text="กำลังโหลด...") { 
      const container = document.getElementById('alumniContainer');
      const loader = document.getElementById('loader');
      
      if (show) {
         container.innerHTML = '';
         loader.querySelector('.loading-text').innerText = text;
         container.appendChild(loader);
         loader.style.display = 'block';
      } else {
         loader.style.display = 'none';
      }
    }
</script>
</body>
</html>
