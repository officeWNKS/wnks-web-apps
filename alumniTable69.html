<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0F172A; 
            --blue: #38BDF8; 
            --gold: #FBBF24;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --map-bg: #E8F0F2; /* สีพื้นหลังแผนผังให้อารมณ์สว่างเหมือนในรูป */
        }
        body {
            margin: 0; padding: 15px; font-family: 'Prompt', sans-serif;
            background-color: var(--navy); color: white; min-height: 100vh;
            overflow-x: hidden; position: relative;
        }

        /* Animated Background Blobs */
        .blob {
            position: fixed; border-radius: 50%; filter: blur(80px);
            z-index: -1; opacity: 0.4; animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 { width: 300px; height: 300px; background: #1D4ED8; top: -50px; left: -50px; }
        .blob-2 { width: 400px; height: 400px; background: #B45309; bottom: -100px; right: -50px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .header-section {
            text-align: center; margin-bottom: 20px;
        }
        h1 { 
            color: transparent; 
            background: linear-gradient(90deg, #FDE68A, #D4AF37);
            -webkit-background-clip: text; background-clip: text;
            margin-top: 10px; margin-bottom: 5px; text-shadow: 0 4px 20px rgba(212,175,55,0.3);
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }

        .status-legend { 
            display:flex; justify-content:center; flex-wrap: wrap; gap:20px; 
            margin-bottom: 20px; font-weight: 400; font-size: 0.95rem;
            background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--glass-border);
            width: fit-content; margin: 0 auto 20px auto;
        }
        .status-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 10px currentColor;}

        /* =========================================
           ระบบแผนผัง (Interactive Floor Plan)
           ========================================= */
        .venue-wrapper {
            width: 100%; overflow-x: auto; /* เลื่อนซ้ายขวาได้ในมือถือ */
            padding-bottom: 20px;
        }
        
        .venue-map {
            min-width: 1100px; /* ล็อคขนาดให้ผังไม่พังในมือถือ */
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 130px 60px 150px 120px; /* เว้นที่ให้เวทีและ Cooking Zone */
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        }

        /* ของตกแต่งในแผนผัง */
        .stage {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            background: #0F172A; border: 2px solid var(--gold); border-radius: 30px;
            padding: 15px 120px; font-size: 1.5rem; font-weight: 600; color: var(--gold);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.15); z-index: 10;
        }
        .cooking-zone {
            position: absolute; left: 25px; bottom: 150px; height: 350px; width: 60px;
            background: #1E293B; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
            font-size: 1.1rem; font-weight: 500; color: #94A3B8; letter-spacing: 2px;
        }
        .entrance-area {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 150px; align-items: flex-end;
            color: #94A3B8; font-weight: 500; font-size: 1.1rem;
        }
        .entrance-box { border: 1px dashed rgba(255,255,255,0.3); padding: 10px 40px; border-radius: 10px; }

        /* Grid จัดการโต๊ะ (10 คอลัมน์) */
        .table-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 20px 15px; /* ระยะห่างพื้นฐาน */
            justify-items: center;
        }

        /* ---------------------------------------------------
           เวทย์มนต์ CSS: สร้างทางเดินเหลืองๆ โดยใช้ Margin! 
           (ไม่ต้องเขียน JS ซับซ้อน โค้ดจะแหวกทางเดินให้อัตโนมัติ)
           --------------------------------------------------- */
        
        /* ทางเดินแนวนอน (หลังแถวที่ 5 และ 10) */
        .table-card:nth-child(n+41):nth-child(-n+50) { margin-bottom: 70px; }
        .table-card:nth-child(n+91):nth-child(-n+100) { margin-bottom: 70px; }

        /* ทางเดินแนวตั้งหลัก (ตรงกลาง หลังคอลัมน์ที่ 5) */
        .table-card:nth-child(10n + 5) { margin-right: 80px; }

        /* ทางเดินแนวตั้งย่อย โซนบนและกลาง (หลังคอลัมน์ 3 และ 7) */
        .table-card:nth-child(10n + 3):nth-child(-n+100) { margin-right: 45px; }
        .table-card:nth-child(10n + 7):nth-child(-n+100) { margin-right: 45px; }
        
        /* ทางเดินแนวตั้งย่อย โซนล่างสุด (มีเฉพาะตรงกลางที่ตั้งไว้แล้ว ไม่ต้องมีด้านข้าง) */
        .table-card:nth-child(10n + 3):nth-child(n+101) { margin-right: 0px; }
        .table-card:nth-child(10n + 7):nth-child(n+101) { margin-right: 0px; }


        /* --------------------------------------------------- */

        /* การ์ดโต๊ะ */
        .table-card {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            width: 75px; 
            transition: 0.3s ease;
        }
        
        .table-btn {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            border: 2px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        /* เก้าอี้จำลอง (ตกแต่งขอบโต๊ะให้เหมือนในรูป) */
        .table-btn::after {
            content: ''; position: absolute; top: -4px; right: -4px;
            width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.15);
        }

        /* สถานะสีของโต๊ะ */
        .table-btn.ว่าง { color: #4ADE80; border-color: rgba(74, 222, 128, 0.6); box-shadow: inset 0 0 10px rgba(74,222,128,0.1); }
        .table-btn.ว่าง:hover { transform: scale(1.15); background: rgba(74, 222, 128, 0.15); box-shadow: 0 10px 20px rgba(74, 222, 128, 0.3); }
        .table-btn.รอตรวจสอบ { color: var(--gold); border-color: rgba(251, 191, 36, 0.5); cursor: not-allowed; }
        .table-btn.ยืนยันแล้ว { color: #64748B; border-color: rgba(100, 116, 139, 0.4); background: rgba(0,0,0,0.5); cursor: not-allowed; }

        /* ข้อมูลใต้โต๊ะ */
        .table-info { text-align: center; width: 100%; line-height: 1.1; }
        .info-status { font-size: 0.65rem; font-weight: 500; margin-bottom: 2px; }
        .info-status.ว่าง { color: #4ADE80; }
        .info-status.รอตรวจสอบ { color: var(--gold); }
        .info-status.ยืนยันแล้ว { color: #94A3B8; }
        
        .info-booker { 
            font-size: 0.75rem; color: rgba(255,255,255,0.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 100%; padding: 2px 4px; box-sizing: border-box;
            background: rgba(0,0,0,0.3); border-radius: 4px;
        }

        /* Modal Styles */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; visibility: hidden; transition: 0.4s ease; padding: 15px; box-sizing: border-box;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px; border-radius: 24px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform: translateY(50px) scale(0.9); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-content { transform: translateY(0) scale(1); }

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        input, .file-upload-label {
            width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 12px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; font-family: 'Prompt', sans-serif; box-sizing: border-box;
            transition: 0.3s; font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }

        input[type="file"] { display: none; }
        .file-upload-label { border: 1px dashed rgba(255,255,255,0.3); cursor: pointer; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 20px 10px; }
        .file-upload-label:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--gold); }
        .file-name { font-size: 0.85rem; color: var(--gold); margin-top: 5px; word-break: break-all; }

        .btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 500; font-family: 'Prompt', sans-serif; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 1rem; }
        .btn-submit { background: linear-gradient(135deg, #F59E0B, #D97706); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.5); }
        .btn-cancel { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); }
        
        #loading { text-align: center; color: rgba(255,255,255,0.6); padding: 50px 0; grid-column: 1 / -1; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="header-section">
        <h1>50 ปี โรงเรียนวังน้ำคู้ศึกษา</h1>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px;">แผนผังจองโต๊ะจีน (1 โต๊ะ = 8 ที่นั่ง)</p>
        
        <div class="status-legend">
            <span style="color:#4ADE80;"><i class="status-dot" style="background:#4ADE80;"></i> ว่าง (กดจองได้)</span>
            <span style="color:var(--gold);"><i class="status-dot" style="background:var(--gold);"></i> รอตรวจสอบ</span>
            <span style="color:#94A3B8;"><i class="status-dot" style="background:#64748B;"></i> ยืนยันแล้ว</span>
        </div>
    </div>

    <!-- แผนผังจำลองสถานที่จริง -->
    <div class="venue-wrapper">
        <div class="venue-map">
            <div class="stage">เวทีของงาน</div>
            <div class="cooking-zone">Cooking Zone</div>
            
            <div class="table-grid" id="grid">
                <div id="loading">กำลังซิงค์แผนผังและข้อมูล... ⏳</div>
            </div>

            <div class="entrance-area">
                <div class="entrance-box">แบ็คดรอปถ่ายรูป</div>
                <div class="entrance-box" style="border-color: var(--blue); color: var(--blue); box-shadow: 0 0 20px rgba(56,189,248,0.2);">ทางเข้างาน</div>
                <div class="entrance-box">จุดลงทะเบียน</div>
            </div>
        </div>
    </div>

    <!-- Modal จองโต๊ะ -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2 style="color: var(--gold); margin-top:0; margin-bottom:15px; font-weight: 500; text-align:center;">จองโต๊ะ <span id="selectedTable"></span></h2>
            
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" required autocomplete="off">
            <input type="text" id="gen" placeholder="ศิษย์เก่ารุ่นที่" required autocomplete="off">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์" required autocomplete="off">
            
            <div class="input-group">
                <input type="date" id="t_date" required title="วันที่โอนเงิน">
                <input type="time" id="t_time" required title="เวลาที่โอนเงิน">
            </div>

            <label class="file-upload-label" for="slip">
                <div style="font-size:1.5rem;">📸</div>
                <div style="font-size:0.9rem; margin-top:5px;">คลิกเพื่ออัปโหลดสลิปการโอนเงิน</div>
                <div class="file-name" id="fileName">ยังไม่ได้เลือกไฟล์ (รับเฉพาะรูปภาพไม่เกิน 5MB)</div>
            </label>
            <input type="file" id="slip" accept="image/*" required>
            
            <button class="btn btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการส่งสลิปจอง</button>
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <script>
        // *** วาง URL ล่าสุดของคุณตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Av1q49qTxa_qC_x4jY6Fjpwz95nHow8RqDY8nfbLIXkVInhJbfyULxXheNHUbyTAA/exec';
        let currentTable = '';

        document.getElementById('slip').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "ยังไม่ได้เลือกไฟล์";
            document.getElementById('fileName').innerText = fileName;
        });

        async function loadTables() {
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                const tables = await res.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                tables.forEach((t, index) => {
                    // สร้าง Card ครอบโต๊ะและข้อมูล
                    const card = document.createElement('div');
                    card.className = 'table-card';

                    // 1. ปุ่มวงกลมโต๊ะ
                    const btn = document.createElement('div');
                    btn.className = `table-btn ${t.Status}`;
                    btn.innerText = t.Table_ID;
                    if(t.Status === 'ว่าง') {
                        btn.onclick = () => openModal(t.Table_ID);
                        btn.title = "คลิกเพื่อจองโต๊ะนี้";
                    }

                    // 2. ข้อมูลแสดงใต้โต๊ะ
                    const info = document.createElement('div');
                    info.className = 'table-info';
                    
                    const statusText = document.createElement('div');
                    statusText.className = `info-status ${t.Status}`;
                    statusText.innerText = t.Status;

                    const bookerText = document.createElement('div');
                    bookerText.className = 'info-booker';
                    
                    // ลอจิกการแสดงชื่อ: ถ้าไม่ว่างให้แสดงชื่อผู้จอง ถ้าว่างให้แสดงขีด (-)
                    let displayName = (t.Status !== 'ว่าง' && t.Booker_Name) ? t.Booker_Name : '-';
                    bookerText.innerText = displayName;
                    bookerText.title = displayName; // ชี้เมาส์เพื่อดูชื่อเต็ม

                    info.appendChild(statusText);
                    info.appendChild(bookerText);

                    card.appendChild(btn);
                    card.appendChild(info);
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('grid').innerHTML = '<div id="loading" style="color:#F87171;">เชื่อมต่อล้มเหลว โปรดรีเฟรชหน้าเว็บใหม่</div>';
            }
        }

        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            document.getElementById('bookModal').classList.add('active');
            
            document.getElementById('name').value = '';
            document.getElementById('gen').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('t_date').value = '';
            document.getElementById('t_time').value = '';
            document.getElementById('slip').value = '';
            document.getElementById('fileName').innerText = 'ยังไม่ได้เลือกไฟล์ (รับเฉพาะรูปภาพ)';
        }
        
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        function getBase64(file) {
           return new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.readAsDataURL(file);
             reader.onload = () => resolve(reader.result);
             reader.onerror = error => reject(error);
           });
        }

        async function submitBooking() {
            const name = document.getElementById('name').value;
            const gen = document.getElementById('gen').value;
            const phone = document.getElementById('phone').value;
            const tDate = document.getElementById('t_date').value;
            const tTime = document.getElementById('t_time').value;
            const fileInput = document.getElementById('slip');

            if(!name || !gen || !phone || !tDate || !tTime || fileInput.files.length === 0) {
                alert("กรุณากรอกข้อมูลและแนบสลิปให้ครบถ้วน"); return;
            }

            const file = fileInput.files[0];
            if(file.size > 5 * 1024 * 1024) {
                alert("ขนาดไฟล์สลิปใหญ่เกินไป (จำกัด 5MB) กรุณาลดขนาดภาพก่อนอัปโหลด");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังอัปโหลดและส่งข้อมูล... ⏳';
            submitBtn.style.opacity = '0.7'; submitBtn.disabled = true;

            try {
                const base64Data = await getBase64(file);
                const finalFileName = `${currentTable}_${phone}_${file.name}`;

                const data = {
                    action: 'book', Table_ID: currentTable,
                    Booker_Name: name, Alumni_Gen: gen, Phone: phone,
                    Transfer_Date: tDate, Transfer_Time: tTime,
                    Slip_Base64: base64Data, Slip_Name: finalFileName
                };
                
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    alert('ส่งคำขอจองและอัปโหลดสลิปเรียบร้อยแล้ว โปรดรอตรวจสอบ');
                    closeModal(); loadTables(); 
                } else {
                    alert('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
                }
            } catch(e) {
                alert('ส่งข้อมูลสำเร็จแต่อาจใช้เวลาประมวลผลรูปภาพ กรุณารีเฟรชหน้าเว็บเพื่อตรวจสอบสถานะ');
                closeModal(); loadTables();
                console.error(e);
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.style.opacity = '1'; submitBtn.disabled = false;
            }
        }

        loadTables();
    </script>
</body>
</html>
