<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F3F6F9;
            --text-main: #1E293B;
            --card-bg: #FFFFFF;
            --green-field: #4ADE80; /* สีพื้นหญ้าตามแบบ */
            --path-color: #E6C280; /* สีทางเดิน */
            --color-free: #10B981; /* เขียวว่าง */
            --color-pending: #F59E0B; /* เหลืองรอ */
            --color-booked: #EF4444; /* แดงจองแล้ว */
            --color-vip: #8B5CF6; /* สีม่วง VIP */
        }
        
        body {
            margin: 0; padding: 0; 
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-main); 
            color: var(--text-main);
        }

        /* --- Header & Dashboard --- */
        .header-container {
            background: var(--card-bg);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 50;
        }
        h1 {
            text-align: center; color: var(--text-main);
            margin: 0 0 5px 0; font-size: clamp(1.4rem, 4vw, 2rem);
        }
        .subtitle { text-align: center; color: #64748B; font-size: 0.9rem; margin-bottom: 15px; }

        .dashboard {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
            max-width: 600px; margin: 0 auto;
        }
        .stat-card {
            flex: 1; min-width: 100px; padding: 10px; border-radius: 12px;
            text-align: center; font-weight: 600; font-size: 0.85rem;
            background: var(--bg-main); border: 1px solid #E2E8F0;
        }
        .stat-num { font-size: 1.5rem; display: block; margin-top: 5px; }
        .stat-free { color: var(--color-free); border-bottom: 3px solid var(--color-free); }
        .stat-pending { color: var(--color-pending); border-bottom: 3px solid var(--color-pending); }
        .stat-booked { color: var(--color-booked); border-bottom: 3px solid var(--color-booked); }

        /* --- Map Container (Mobile Optimized) --- */
        .map-wrapper {
            width: 100%; overflow-x: auto; overflow-y: hidden;
            padding: 20px 10px; box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-hint {
            text-align: center; font-size: 0.85rem; color: #94A3B8;
            margin-top: 10px; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }

        /* --- Floor Plan Layout --- */
        .venue-map {
            min-width: 900px; /* บังคับความกว้างให้ Layout ไม่เพี้ยนบนมือถือ */
            background: var(--green-field);
            padding: 30px; border-radius: 20px; margin: 0 auto;
            position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
        }

        .decor { background: #1E293B; color: white; text-align: center; font-weight: 600; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .stage { width: 400px; height: 80px; margin: 0 auto 30px auto; font-size: 1.4rem; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .music-console { width: 150px; height: 50px; margin: 0 auto; background: #334155; }
        
        .cooking-zone-left { position: absolute; left: 10px; width: 60px; background: #334155; color: white; writing-mode: vertical-rl; text-align: center; font-size: 0.9rem; border-radius: 10px; padding: 20px 0; }
        .cz1 { top: 250px; height: 200px; }
        .cz2 { top: 600px; height: 200px; }

        /* --- Grid System --- */
        .map-row { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .h-path { width: 100%; height: 30px; background: var(--path-color); margin-bottom: 20px; display: flex; align-items: center; justify-content: center;}
        .v-path { width: 30px; background: var(--path-color); flex-shrink: 0; }

        .table-col { display: grid; gap: 15px; }
        .col-2 { grid-template-columns: repeat(2, 1fr); }
        .col-3 { grid-template-columns: repeat(3, 1fr); }

        /* --- Table Item --- */
        .table-item {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            position: relative; transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Status Colors */
        .table-item.ว่าง { background: #FFFFFF; color: var(--color-free); border: 3px solid var(--color-free); }
        .table-item.ว่าง:hover { transform: scale(1.1); background: var(--color-free); color: white; }
        .table-item.รอตรวจสอบ { background: var(--color-pending); color: white; border: 3px solid #D97706; }
        .table-item.ยืนยันแล้ว { background: var(--color-booked); color: white; border: 3px solid #B91C1C; }

        .table-item.vip::before {
            content: 'VIP'; position: absolute; top: -12px; background: var(--color-vip);
            color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px;
        }

        /* --- Modal Form --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; visibility: hidden; transition: 0.3s; padding: 15px; box-sizing: border-box;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--card-bg); border-radius: 20px; width: 100%; max-width: 400px;
            padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px); transition: 0.3s; max-height: 90vh; overflow-y: auto;
        }
        .modal.active .modal-content { transform: translateY(0); }
        .modal h2 { margin-top: 0; color: var(--text-main); text-align: center; border-bottom: 2px solid var(--bg-main); padding-bottom: 10px; }

        .form-control { width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 10px; border: 1px solid #CBD5E1; font-family: 'Prompt', sans-serif; box-sizing: border-box; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--color-free); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        
        .file-upload-label { display: block; border: 2px dashed #CBD5E1; text-align: center; padding: 20px 10px; border-radius: 10px; cursor: pointer; color: #64748B; margin-top: 10px; }
        .file-upload-label:hover { border-color: var(--color-free); background: #F0FDF4; }
        input[type="file"] { display: none; }

        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; font-family: 'Prompt', sans-serif; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .btn-submit { background: var(--color-free); color: white; }
        .btn-submit:hover { background: #059669; }
        .btn-cancel { background: #F1F5F9; color: #64748B; }
        .btn-cancel:hover { background: #E2E8F0; }

        /* Loader & Toast */
        .loader { border: 4px solid #F3F4F6; border-top: 4px solid var(--color-free); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-screen { text-align: center; padding: 50px; font-weight: 600; color: #64748B; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1E293B; color: white; padding: 12px 25px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
            opacity: 0; visibility: hidden; transition: 0.3s; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <!-- Header & Dashboard -->
    <div class="header-container">
        <h1>50 ปี วังน้ำคู้ศึกษา</h1>
        <div class="subtitle">แผนผังจองโต๊ะจีน (1 โต๊ะ = 8 ที่นั่ง)</div>
        
        <div class="dashboard">
            <div class="stat-card stat-free">
                <div>ว่าง</div>
                <span class="stat-num" id="count-free">-</span>
            </div>
            <div class="stat-card stat-pending">
                <div>รอตรวจสอบ</div>
                <span class="stat-num" id="count-pending">-</span>
            </div>
            <div class="stat-card stat-booked">
                <div>จองแล้ว</div>
                <span class="stat-num" id="count-booked">-</span>
            </div>
        </div>
        <div class="scroll-hint">👈 เลื่อนซ้าย-ขวา เพื่อดูผังทั้งหมด 👉</div>
    </div>

    <!-- Map Area -->
    <div class="map-wrapper">
        <div id="loading-screen">
            <div class="loader"></div>
            <p>กำลังโหลดข้อมูลโต๊ะล่าสุด...</p>
        </div>

        <!-- ตัวแผนผังจะถูก Generate ด้วย JS ให้อยู่ในกรอบนี้ -->
        <div class="venue-map" id="venue-map" style="display: none;">
            <div class="decor stage">เวทีงาน</div>
            
            <div class="decor cooking-zone-left cz1">Cooking Zone</div>
            <div class="decor cooking-zone-left cz2">Cooking Zone</div>

            <!-- Block 1 -->
            <div class="map-row" id="block-1"></div>
            
            <!-- Path ระหว่าง Block 1 & 2 -->
            <div class="h-path"><div class="decor music-console">Music Console</div></div>

            <!-- Block 2 -->
            <div class="map-row" id="block-2"></div>

            <div class="h-path"></div>

            <!-- Block 3 -->
            <div class="map-row" id="block-3"></div>

            <div style="text-align: center; margin-top: 20px;">
                <div class="decor" style="display:inline-block; padding:10px 30px;">⛩️ ซุ้มประตู / จุดลงทะเบียน ⛩️</div>
            </div>
        </div>
    </div>

    <!-- Modal จองโต๊ะ -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2>จองโต๊ะ <span id="selectedTable" style="color: var(--color-free);"></span></h2>
            
            <input type="text" class="form-control" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" autocomplete="off">
            <input type="text" class="form-control" id="gen" placeholder="ศิษย์เก่ารุ่นที่ (ถ้ามี)" autocomplete="off">
            <input type="tel" class="form-control" id="phone" placeholder="เบอร์โทรศัพท์" autocomplete="off">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label style="font-size: 0.8rem; color:#64748B;">วันที่โอน</label>
                    <input type="date" class="form-control" id="t_date">
                </div>
                <div>
                    <label style="font-size: 0.8rem; color:#64748B;">เวลาที่โอน</label>
                    <input type="time" class="form-control" id="t_time">
                </div>
            </div>
            
            <label class="file-upload-label" for="slip">
                <div style="font-size:1.5rem; margin-bottom: 5px;">📥</div>
                <div style="font-weight: 500; color: var(--text-main);">คลิกเพื่อแนบสลิปโอนเงิน</div>
                <div id="fileName" style="font-size: 0.85rem; margin-top: 5px;">ขนาดไม่เกิน 5MB</div>
            </label>
            <input type="file" id="slip" accept="image/*">
            
            <button class="btn btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการจอง</button>
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastMsg">ข้อความแจ้งเตือน</span>
    </div>

    <script>
        // *** ใส URL ของ Google Apps Script ของคุณตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Av1q49qTxa_qC_x4jY6Fjpwz95nHow8RqDY8nfbLIXkVInhJbfyULxXheNHUbyTAA/exec';
        
        let currentTable = '';
        let allTables = [];

        // UI Functions
        function showToast(message) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        document.getElementById('slip').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "ขนาดไม่เกิน 5MB";
            document.getElementById('fileName').innerText = fileName;
            document.getElementById('fileName').style.color = 'var(--color-free)';
        });

        function handleTableClick(tableId, status, booker) {
            if (status === 'ว่าง') {
                openModal(tableId);
            } else {
                let msg = status === 'รอตรวจสอบ' ? `โต๊ะ ${tableId} กำลังรอตรวจสอบการจอง` : `โต๊ะ ${tableId} จองแล้วโดย: ${booker || 'ไม่ระบุ'}`;
                showToast(msg);
            }
        }

        function createTableBtn(t, isVIP = false) {
            if(!t) return '<div></div>'; 
            let vipClass = isVIP ? 'vip' : '';
            return `<div class="table-item ${t.Status} ${vipClass}" onclick="handleTableClick('${t.Table_ID}', '${t.Status}', '${t.Booker_Name}')" title="${t.Table_ID} - ${t.Status}">${t.Table_ID}</div>`;
        }

        // Logic ช่วยตัด Array ข้อมูลโต๊ะ
        let tIdx = 0;
        function getTablesBlock(count, isTopBlock = false) {
            let html = '';
            for(let i = 0; i < count; i++) {
                if(allTables[tIdx]) {
                    // กำหนดให้ 3 โต๊ะแรกของ Block กลางในแถวบนสุดเป็น VIP
                    let isVIP = isTopBlock && i < 3;
                    html += createTableBtn(allTables[tIdx], isVIP);
                }
                tIdx++;
            }
            return html;
        }

        async function loadTables() {
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                allTables = await res.json();
                
                // คำนวณ Dashboard
                let free = 0, pending = 0, booked = 0;
                allTables.forEach(t => {
                    if(t.Status === 'ว่าง') free++;
                    else if(t.Status === 'รอตรวจสอบ') pending++;
                    else booked++;
                });
                document.getElementById('count-free').innerText = free;
                document.getElementById('count-pending').innerText = pending;
                document.getElementById('count-booked').innerText = booked;

                // รีเซ็ต Index
                tIdx = 0;

                // วาดผัง Block 1 (A=14, B=21, C=14) รวม 49
                document.getElementById('block-1').innerHTML = `
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-3">${getTablesBlock(21, true)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                `;

                // วาดผัง Block 2 (A=14, B=21, C=14) รวม 49
                document.getElementById('block-2').innerHTML = `
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-3">${getTablesBlock(21)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                `;

                // วาดผัง Block 3 (A=14, B=24, C=14) รวม 52
                document.getElementById('block-3').innerHTML = `
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-3">${getTablesBlock(24)}</div>
                    <div class="v-path"></div>
                    <div class="table-col col-2">${getTablesBlock(14)}</div>
                `;

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('venue-map').style.display = 'block';

            } catch (error) {
                document.getElementById('loading-screen').innerHTML = '<p style="color:red;">❌ เชื่อมต่อล้มเหลว โปรดรีเฟรชหน้าเว็บใหม่</p>';
            }
        }

        // Modal Functions
        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            
            document.getElementById('name').value = '';
            document.getElementById('gen').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('t_date').value = '';
            document.getElementById('t_time').value = '';
            document.getElementById('slip').value = '';
            document.getElementById('fileName').innerText = 'ขนาดไม่เกิน 5MB';
            document.getElementById('fileName').style.color = '#64748B';
            
            document.getElementById('bookModal').classList.add('active');
        }
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        function getBase64(file) {
           return new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.readAsDataURL(file);
             reader.onload = () => resolve(reader.result);
             reader.onerror = error => reject(error);
           });
        }

        async function submitBooking() {
            const name = document.getElementById('name').value.trim();
            const gen = document.getElementById('gen').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const tDate = document.getElementById('t_date').value;
            const tTime = document.getElementById('t_time').value;
            const fileInput = document.getElementById('slip');

            if(!name || !phone || !tDate || !tTime || fileInput.files.length === 0) {
                showToast("⚠️ กรุณากรอกข้อมูลและแนบสลิปให้ครบถ้วน"); return;
            }

            const file = fileInput.files[0];
            if(file.size > 5 * 1024 * 1024) {
                showToast("⚠️ ไฟล์สลิปใหญ่เกิน 5MB"); return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = '<div class="loader" style="width:20px;height:20px;border-width:2px;display:inline-block;vertical-align:middle; border-top-color:#fff;"></div> กำลังส่งข้อมูล...';
            submitBtn.disabled = true;

            try {
                const base64Data = await getBase64(file);
                const finalFileName = `${currentTable}_${phone}_${file.name}`;

                const data = {
                    action: 'book', Table_ID: currentTable,
                    Booker_Name: name, Alumni_Gen: gen, Phone: phone,
                    Transfer_Date: tDate, Transfer_Time: tTime,
                    Slip_Base64: base64Data, Slip_Name: finalFileName
                };
                
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                if(result.status === 'success') {
                    showToast('✅ ส่งคำขอจองเรียบร้อยแล้ว');
                    closeModal(); 
                    document.getElementById('venue-map').style.display = 'none';
                    document.getElementById('loading-screen').style.display = 'block';
                    loadTables(); 
                } else {
                    showToast('⚠️ ' + result.message);
                }
            } catch(e) {
                showToast('✅ ส่งข้อมูลสำเร็จ (กำลังอัปเดตผัง...)');
                closeModal(); loadTables();
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }

        // Initialize
        loadTables();
    </script>
</body>
</html>
