<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Neumorphism Color Palette */
            --bg-color: #E0E5EC;
            --text-main: #2D3748;
            --text-muted: #718096;
            
            /* Status Colors */
            --color-free: #059669; /* เขียว */
            --color-pending: #D97706; /* ส้มทอง */
            --color-booked: #64748B; /* เทา */
            --color-carpet: #EAB308; /* เหลืองทางเดิน */
            --color-navy: #1E3A8A; /* น้ำเงินเข้ม */

            /* Neumorphism Shadows */
            --shadow-out: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.7);
            --shadow-in: inset 6px 6px 10px 0 rgba(163, 177, 198, 0.6), inset -6px -6px 10px 0 rgba(255, 255, 255, 0.8);
            --shadow-hover: 12px 12px 20px rgb(163,177,198,0.7), -12px -12px 20px rgba(255,255,255, 0.8);
            --shadow-active: inset 3px 3px 6px 0 rgba(163, 177, 198, 0.6), inset -3px -3px 6px 0 rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0; padding: 20px 10px; font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            min-height: 100vh; overflow-x: hidden;
        }

        .header-section {
            text-align: center; margin-bottom: 30px;
        }
        h1 { 
            color: var(--color-navy); font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin: 10px 0; font-weight: 600; text-shadow: 2px 2px 4px rgba(163,177,198,0.5);
        }

        .status-legend { 
            display:flex; justify-content:center; flex-wrap: wrap; gap:20px; 
            margin: 0 auto 30px auto; font-weight: 500; font-size: 0.95rem;
            background: var(--bg-color); padding: 15px 30px; border-radius: 30px;
            box-shadow: var(--shadow-out); width: fit-content;
        }
        .status-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 5px; box-shadow: var(--shadow-in);}

        /* =========================================
           ระบบแผนผัง (Interactive Floor Plan)
           ========================================= */
        .venue-wrapper {
            width: 100%; overflow-x: auto; padding-bottom: 40px;
        }
        
        .venue-map {
            min-width: 1100px; max-width: 1200px; margin: 0 auto;
            position: relative; background: var(--bg-color);
            border-radius: 50px; padding: 160px 80px 180px 80px; 
            box-shadow: var(--shadow-out);
        }

        /* ของตกแต่งในแผนผัง Neumorphism */
        .stage {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--color-navy); color: white; border-radius: 30px;
            padding: 20px 150px; font-size: 1.8rem; font-weight: 600;
            box-shadow: var(--shadow-out); z-index: 10;
        }
        
        /* Cooking Zone 2 จุดซ้ายมือ */
        .cooking-zone {
            position: absolute; left: 20px; width: 60px;
            background: var(--color-navy); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-size: 1rem; font-weight: 500; color: white; letter-spacing: 2px;
            box-shadow: var(--shadow-out);
        }
        .cooking-zone.top { top: 300px; height: 250px; }
        .cooking-zone.bottom { top: 600px; height: 250px; }

        .entrance-area {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 100px; align-items: flex-end;
            font-weight: 600; font-size: 1.1rem;
        }
        .entrance-box { 
            background: var(--bg-color); padding: 15px 40px; border-radius: 15px; 
            box-shadow: var(--shadow-out); color: var(--text-main);
        }
        .entrance-box.main { 
            color: var(--color-navy); 
            box-shadow: var(--shadow-in); /* กดบุ๋มลงไปสำหรับทางเข้า */
        }

        /* ---------------------------------------------------
           Grid จัดการโต๊ะ 150 โต๊ะ (9 คอลัมน์)
           --------------------------------------------------- */
        .table-grid {
            display: grid;
            /* 9 คอลัมน์: โต๊ะ2 | ทางเดิน | โต๊ะ3 | ทางเดิน | โต๊ะ2 */
            grid-template-columns: 80px 80px 30px 80px 80px 80px 30px 80px 80px;
            grid-auto-rows: 90px;
            gap: 15px 25px;
            justify-content: center;
            position: relative;
        }

        /* พรมทางเดินสีเหลืองทอง ฝังใน Grid */
        .carpet { background: var(--color-carpet); border-radius: 15px; box-shadow: var(--shadow-in); opacity: 0.8;}
        
        /* Music Console ฝังใน Grid */
        .music-console {
            background: var(--color-navy); color: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 500; box-shadow: var(--shadow-out); font-size: 1.1rem;
        }

        /* การ์ดโต๊ะ Neumorphism */
        .table-card {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            width: 100%; transition: 0.3s ease;
        }
        
        .table-btn {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            background: var(--bg-color); color: var(--text-muted);
            box-shadow: var(--shadow-out);
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        
        /* เก้าอี้จำลอง (จุดวงกลมรอบโต๊ะ) */
        .table-btn::after {
            content: ''; position: absolute; top: -5px; right: -5px;
            width: 14px; height: 14px; border-radius: 50%; background: var(--bg-color);
            box-shadow: var(--shadow-out);
        }

        /* สถานะสีของโต๊ะ */
        .table-btn.ว่าง { color: var(--color-free); }
        .table-btn.ว่าง:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .table-btn.ว่าง:active { box-shadow: var(--shadow-active); transform: translateY(0); }
        
        .table-btn.รอตรวจสอบ { color: var(--color-pending); box-shadow: var(--shadow-in); cursor: not-allowed; }
        .table-btn.ยืนยันแล้ว { color: var(--color-booked); box-shadow: var(--shadow-in); opacity: 0.7; cursor: not-allowed; }

        /* การตกแต่งโต๊ะ VIP (3 โต๊ะตรงกลางด้านหน้า) */
        .vip-table .table-btn {
            border: 2px dashed var(--color-pending);
        }

        /* ข้อมูลใต้โต๊ะ */
        .table-info { text-align: center; width: 100%; line-height: 1.2; }
        .info-status { font-size: 0.7rem; font-weight: 600; margin-bottom: 3px; }
        .info-status.ว่าง { color: var(--color-free); }
        .info-status.รอตรวจสอบ { color: var(--color-pending); }
        .info-status.ยืนยันแล้ว { color: var(--color-booked); }
        
        .info-booker { 
            font-size: 0.75rem; color: var(--text-main); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 100%; padding: 3px; box-sizing: border-box;
            background: var(--bg-color); box-shadow: var(--shadow-in); border-radius: 6px;
        }

        /* =========================================
           Modal Styles (Neumorphism)
           ========================================= */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(224, 229, 236, 0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 15px; box-sizing: border-box;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--bg-color); padding: 40px 30px; border-radius: 30px; 
            width: 100%; max-width: 420px; box-shadow: var(--shadow-out);
            transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-content { transform: translateY(0) scale(1); }

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        input, .file-upload-label {
            width: 100%; padding: 14px 18px; margin: 10px 0; border-radius: 15px;
            background: var(--bg-color); border: none; outline: none;
            color: var(--text-main); font-family: 'Prompt', sans-serif; box-sizing: border-box;
            box-shadow: var(--shadow-in); font-size: 0.95rem; transition: 0.3s;
        }
        input:focus { box-shadow: var(--shadow-in), 0 0 0 2px rgba(217, 119, 6, 0.3); }

        input[type="file"] { display: none; }
        .file-upload-label { 
            cursor: pointer; text-align: center; padding: 25px 10px; 
            box-shadow: var(--shadow-out); margin-top: 20px;
        }
        .file-upload-label:active { box-shadow: var(--shadow-active); }
        .file-name { font-size: 0.85rem; color: var(--color-pending); margin-top: 8px; word-break: break-all; }

        .btn { 
            width: 100%; padding: 15px; border-radius: 15px; border: none; 
            font-weight: 600; font-family: 'Prompt', sans-serif; cursor: pointer; 
            transition: 0.2s; margin-top: 15px; font-size: 1rem;
        }
        .btn-submit { background: var(--bg-color); color: var(--color-pending); box-shadow: var(--shadow-out); }
        .btn-submit:active { box-shadow: var(--shadow-active); }
        .btn-cancel { background: var(--bg-color); color: var(--text-muted); box-shadow: var(--shadow-out); margin-top: 10px;}
        .btn-cancel:active { box-shadow: var(--shadow-active); }
        
        #loading { text-align: center; color: var(--color-pending); padding: 50px 0; font-size: 1.2rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>50 ปี โรงเรียนวังน้ำคู้ศึกษา</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-weight: 500;">แผนผังจองโต๊ะจีน (1 โต๊ะ = 8 ที่นั่ง) - 150 โต๊ะ</p>
        
        <div class="status-legend">
            <span style="color:var(--color-free);"><i class="status-dot" style="background:var(--color-free);"></i> ว่าง (กดจองได้)</span>
            <span style="color:var(--color-pending);"><i class="status-dot" style="background:var(--color-pending);"></i> รอตรวจสอบ</span>
            <span style="color:var(--color-booked);"><i class="status-dot" style="background:var(--color-booked);"></i> ยืนยันแล้ว</span>
        </div>
    </div>

    <!-- แผนผังสถานที่จริง -->
    <div class="venue-wrapper">
        <div class="venue-map">
            <div class="stage">เวทีของงาน</div>
            <div class="cooking-zone top">Cooking Zone</div>
            <div class="cooking-zone bottom">Cooking Zone</div>
            
            <div class="table-grid" id="grid">
                <!-- พรมทางเดินเหลืองทอง จะถูกฝังที่นี่ -->
                <div class="carpet" style="grid-column: 3; grid-row: 1 / 25;"></div>
                <div class="carpet" style="grid-column: 7; grid-row: 1 / 25;"></div>
                <div class="carpet" style="grid-column: 1 / 10; grid-row: 9;"></div>
                <div class="carpet" style="grid-column: 1 / 10; grid-row: 16;"></div>

                <!-- Music Console -->
                <div class="music-console" style="grid-column: 4 / 7; grid-row: 10;">Music Console</div>

                <!-- JS จะ Render โต๊ะทั้ง 150 ตัวลงในนี้แบบเลี่ยงช่องทางเดิน -->
            </div>

            <div class="entrance-area">
                <div class="entrance-box">แบ็คดรอปถ่ายรูป</div>
                <div class="entrance-box main">ทางเข้างาน</div>
                <div class="entrance-box">จุดลงทะเบียน</div>
            </div>
        </div>
    </div>

    <!-- Modal จองโต๊ะ -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2 style="color: var(--color-navy); margin-top:0; margin-bottom:20px; font-weight: 600; text-align:center;">จองโต๊ะ <span id="selectedTable"></span></h2>
            
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" required autocomplete="off">
            <input type="text" id="gen" placeholder="ศิษย์เก่ารุ่นที่" required autocomplete="off">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์" required autocomplete="off">
            
            <div class="input-group">
                <input type="date" id="t_date" required title="วันที่โอนเงิน">
                <input type="time" id="t_time" required title="เวลาที่โอนเงิน">
            </div>

            <label class="file-upload-label" for="slip">
                <div style="font-size:1.8rem; margin-bottom: 5px;">📸</div>
                <div style="font-size:0.95rem; font-weight:500; color:var(--text-main);">คลิกเพื่ออัปโหลดสลิป</div>
                <div class="file-name" id="fileName">ยังไม่ได้เลือกไฟล์ (ไม่เกิน 5MB)</div>
            </label>
            <input type="file" id="slip" accept="image/*" required>
            
            <button class="btn btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการส่งสลิปจอง</button>
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Av1q49qTxa_qC_x4jY6Fjpwz95nHow8RqDY8nfbLIXkVInhJbfyULxXheNHUbyTAA/exec';
        let currentTable = '';

        document.getElementById('slip').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "ยังไม่ได้เลือกไฟล์";
            document.getElementById('fileName').innerText = fileName;
        });

        async function loadTables() {
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                const tables = await res.json();
                
                // เก็บ Element พื้นฐานใน Grid ไว้ (พวก Carpet และ Console)
                const grid = document.getElementById('grid');
                const baseElements = `
                    <div class="carpet" style="grid-column: 3; grid-row: 1 / 25;"></div>
                    <div class="carpet" style="grid-column: 7; grid-row: 1 / 25;"></div>
                    <div class="carpet" style="grid-column: 1 / 10; grid-row: 9;"></div>
                    <div class="carpet" style="grid-column: 1 / 10; grid-row: 16;"></div>
                    <div class="music-console" style="grid-column: 4 / 7; grid-row: 10;">Music Console</div>
                `;
                grid.innerHTML = baseElements;
                
                let r = 1; // Row
                let c = 1; // Column

                tables.forEach((t) => {
                    // Algorithm เพื่อข้ามช่องว่าง (ทางเดินและ Console) อัตโนมัติ
                    while (true) {
                        if (c === 3 || c === 7) c++; // ข้ามคอลัมน์พรมแนวตั้ง
                        if (c > 9) { c = 1; r++; } // ขึ้นบรรทัดใหม่
                        if (r === 9 || r === 16) r++; // ข้ามแถวพรมแนวนอน
                        if (r === 10 && c >= 4 && c <= 6) { c = 8; continue; } // ข้าม Music console
                        break; // เจอช่องว่างที่ลงโต๊ะได้
                    }

                    // สร้าง Card โต๊ะ
                    const card = document.createElement('div');
                    card.className = 'table-card';
                    card.style.gridColumn = c;
                    card.style.gridRow = r;

                    // กำหนดให้โต๊ะ 3 ตัวกลางหน้าสุด (Row 1, Col 4,5,6) เป็น VIP ตามภาพ
                    if(r === 1 && (c >= 4 && c <= 6)) {
                        card.classList.add('vip-table');
                    }

                    const btn = document.createElement('div');
                    btn.className = `table-btn ${t.Status}`;
                    btn.innerText = t.Table_ID;
                    if(t.Status === 'ว่าง') {
                        btn.onclick = () => openModal(t.Table_ID);
                        btn.title = "คลิกเพื่อจองโต๊ะนี้";
                    }

                    const info = document.createElement('div');
                    info.className = 'table-info';
                    
                    const statusText = document.createElement('div');
                    statusText.className = `info-status ${t.Status}`;
                    statusText.innerText = t.Status;

                    const bookerText = document.createElement('div');
                    bookerText.className = 'info-booker';
                    
                    let displayName = (t.Status !== 'ว่าง' && t.Booker_Name) ? t.Booker_Name : '-';
                    bookerText.innerText = displayName;
                    bookerText.title = displayName;

                    info.appendChild(statusText);
                    info.appendChild(bookerText);
                    card.appendChild(btn);
                    card.appendChild(info);
                    grid.appendChild(card);
                    
                    c++; // ขยับไปวางโต๊ะถัดไป
                });
            } catch (error) {
                document.getElementById('grid').innerHTML = '<div id="loading" style="color:#D97706;">เชื่อมต่อล้มเหลว โปรดรีเฟรชหน้าเว็บใหม่</div>';
            }
        }

        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            document.getElementById('bookModal').classList.add('active');
            
            document.getElementById('name').value = '';
            document.getElementById('gen').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('t_date').value = '';
            document.getElementById('t_time').value = '';
            document.getElementById('slip').value = '';
            document.getElementById('fileName').innerText = 'ยังไม่ได้เลือกไฟล์ (ไม่เกิน 5MB)';
        }
        
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        function getBase64(file) {
           return new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.readAsDataURL(file);
             reader.onload = () => resolve(reader.result);
             reader.onerror = error => reject(error);
           });
        }

        async function submitBooking() {
            const name = document.getElementById('name').value;
            const gen = document.getElementById('gen').value;
            const phone = document.getElementById('phone').value;
            const tDate = document.getElementById('t_date').value;
            const tTime = document.getElementById('t_time').value;
            const fileInput = document.getElementById('slip');

            if(!name || !gen || !phone || !tDate || !tTime || fileInput.files.length === 0) {
                alert("กรุณากรอกข้อมูลและแนบสลิปให้ครบถ้วน"); return;
            }

            const file = fileInput.files[0];
            if(file.size > 5 * 1024 * 1024) {
                alert("ขนาดไฟล์สลิปใหญ่เกินไป (จำกัด 5MB) กรุณาลดขนาดภาพก่อนอัปโหลด");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังส่งข้อมูล... ⏳';
            submitBtn.style.opacity = '0.7'; submitBtn.disabled = true;

            try {
                const base64Data = await getBase64(file);
                const finalFileName = `${currentTable}_${phone}_${file.name}`;

                const data = {
                    action: 'book', Table_ID: currentTable,
                    Booker_Name: name, Alumni_Gen: gen, Phone: phone,
                    Transfer_Date: tDate, Transfer_Time: tTime,
                    Slip_Base64: base64Data, Slip_Name: finalFileName
                };
                
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    alert('ส่งคำขอจองและอัปโหลดสลิปเรียบร้อยแล้ว โปรดรอตรวจสอบ');
                    closeModal(); loadTables(); 
                } else {
                    alert('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
                }
            } catch(e) {
                alert('ส่งข้อมูลสำเร็จแต่อาจใช้เวลาประมวลผลรูปภาพ กรุณารีเฟรชหน้าเว็บเพื่อตรวจสอบสถานะ');
                closeModal(); loadTables();
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.style.opacity = '1'; submitBtn.disabled = false;
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้า
        document.getElementById('grid').innerHTML = '<div id="loading">กำลังซิงค์ข้อมูลโต๊ะ... ⏳</div>';
        loadTables();
    </script>
</body>
</html>
