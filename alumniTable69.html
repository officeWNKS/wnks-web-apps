<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <style>
        :root {
            --navy: #13253F;
            --blue: #4A789C;
            --gold: #D4AF37;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #0a1321 100%);
            color: white; min-height: 100vh;
        }
        .glass-container {
            max-width: 1000px; margin: 0 auto; padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3); /* ขอบสีทองใส */
            border-radius: 20px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { color: var(--gold); text-shadow: 0 2px 10px rgba(212,175,55,0.5); }
        .table-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px; margin-top: 30px;
        }
        .table-btn {
            padding: 15px; border-radius: 50%; /* โต๊ะกลม */
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold; cursor: pointer; transition: 0.3s;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            color: white; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
        }
        .table-btn.ว่าง { border-color: #4CAF50; box-shadow: 0 0 10px rgba(76,175,80,0.5); }
        .table-btn.รอตรวจสอบ { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.5); cursor: not-allowed; }
        .table-btn.ยืนยันแล้ว { border-color: #f44336; background: rgba(244,67,54,0.2); color: #aaa; cursor: not-allowed; }
        .table-btn:hover:not(.รอตรวจสอบ):not(.ยืนยันแล้ว) { background: var(--blue); transform: scale(1.1); }
        
        /* Modal สำหรับฟอร์มจอง */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(19, 37, 63, 0.8); border: 1px solid var(--gold);
            padding: 30px; border-radius: 15px; width: 300px; text-align: left;
        }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: rgba(255,255,255,0.9); box-sizing: border-box;}
        button { background: var(--gold); color: var(--navy); border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top:10px;}
    </style>
</head>
<body>
    <div class="glass-container">
        <h1>50 ปี โรงเรียนวังน้ำคู้ศึกษา</h1>
        <p>เลือกโต๊ะที่ต้องการจอง (1 โต๊ะ = 8 ที่นั่ง)</p>
        <div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">
            <span style="color:#4CAF50;">🟢 ว่าง</span>
            <span style="color:var(--gold);">🟡 รอตรวจสอบ</span>
            <span style="color:#f44336;">🔴 จองแล้ว</span>
        </div>
        <div class="table-grid" id="grid">กำลังโหลดข้อมูล...</div>
    </div>

    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2 style="color: var(--gold); margin-top:0;">จองโต๊ะ <span id="selectedTable"></span></h2>
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" required>
            <input type="text" id="gen" placeholder="ศิษย์เก่ารุ่นที่" required>
            <input type="text" id="phone" placeholder="เบอร์โทรศัพท์" required>
            <input type="text" id="ref" placeholder="เลขอ้างอิงสลิปโอนเงิน (ถ้ามี)" required>
            <button onclick="submitBooking()">ยืนยันการจอง</button>
            <button onclick="closeModal()" style="background: #555; color: white;">ยกเลิก</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9JKyiqStSo6ncEmYKjSrVwzgIjc2ZvRJi_b_huBKsDqXlHYeFqvKqULpfvLgqfPspxA/exec'; // <<<<<<< แก้ไขตรงนี้
        let currentTable = '';

        async function loadTables() {
            const res = await fetch(SCRIPT_URL);
            const tables = await res.json();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            tables.forEach(t => {
                const btn = document.createElement('div');
                btn.className = `table-btn ${t.Status}`;
                btn.innerText = t.Table_ID;
                if(t.Status === 'ว่าง') {
                    btn.onclick = () => openModal(t.Table_ID);
                }
                grid.appendChild(btn);
            });
        }

        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            document.getElementById('bookModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('bookModal').style.display = 'none'; }

        async function submitBooking() {
            const data = {
                action: 'book', Table_ID: currentTable,
                Booker_Name: document.getElementById('name').value,
                Alumni_Gen: document.getElementById('gen').value,
                Phone: document.getElementById('phone').value,
                Ref_Code: document.getElementById('ref').value
            };
            
            document.querySelector('#bookModal button').innerText = 'กำลังส่งข้อมูล...';
            
            await fetch(SCRIPT_URL, {
                method: 'POST', body: JSON.stringify(data)
            });
            
            alert('ส่งคำขอจองเรียบร้อยแล้ว โปรดรอแอดมินตรวจสอบ');
            closeModal();
            loadTables(); // รีเฟรชหน้า
        }

        loadTables();
    </script>
</body>
</html>
