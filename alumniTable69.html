<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B1120; /* สีพื้นหลังสีกรมท่าเข้ม สบายตา */
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            --color-available: #34D399; /* เขียวพาสเทล */
            --color-pending: #FBBF24;   /* เหลืองทอง */
            --color-confirmed: #94A3B8; /* เทา */
            --color-accent: #38BDF8;    /* ฟ้าสดใส */
            --walkway-color: rgba(251, 191, 36, 0.15); /* สีทางเดินจางๆ */
        }

        body {
            margin: 0; padding: 20px 10px; font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color); color: white; min-height: 100vh;
            overflow-x: hidden; position: relative;
        }

        /* Ambient Background Glow (Glassmorphism base) */
        .ambient-glow {
            position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.5;
            animation: pulse 10s infinite alternate;
        }
        .glow-1 { top: -10%; left: 10%; width: 40vw; height: 40vw; background: rgba(56, 189, 248, 0.2); }
        .glow-2 { bottom: -10%; right: 10%; width: 50vw; height: 50vw; background: rgba(251, 191, 36, 0.15); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        /* --- Header & Legend --- */
        .header-section {
            text-align: center; margin-bottom: 30px; position: relative; z-index: 10;
        }
        h1 { 
            background: linear-gradient(to right, #FDE68A, #D4AF37, #FDE68A);
            -webkit-background-clip: text; color: transparent;
            margin: 0 0 10px 0; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 600;
            text-shadow: 0 4px 20px rgba(212,175,55,0.2);
        }

        .status-legend { 
            display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 12px 25px; border-radius: 50px; border: 1px solid var(--glass-border);
            font-size: 0.9rem; font-weight: 400; box-shadow: var(--glass-shadow);
        }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

        /* --- Interactive Floor Plan (Glassmorphism) --- */
        .venue-wrapper {
            width: 100%; overflow-x: auto; padding: 20px 0 40px 0;
            /* ซ่อน scrollbar แต่ยังเลื่อนได้ */
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .venue-wrapper::-webkit-scrollbar { display: none; }
        
        .venue-map {
            min-width: 1200px; /* ล็อคขนาดให้ผังตรงตามสัดส่วน */
            max-width: 1400px;
            margin: 0 auto; position: relative;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 40px;
            padding: 180px 100px 180px 150px; /* เว้นที่ให้ UI รอบๆ */
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 50px rgba(0,0,0,0.3);
        }

        /* --- Map Decorations --- */
        .stage-area {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(180deg, #1E293B, #0F172A);
            border: 2px solid var(--color-pending); border-radius: 40px;
            padding: 20px 180px; font-size: 1.6rem; font-weight: 600; color: var(--color-pending);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.1); text-align: center;
        }
        .stage-area::before {
            content: '🎵🥁🎺'; display: block; font-size: 1.2rem; margin-bottom: 5px; opacity: 0.8;
        }

        .cooking-zone {
            position: absolute; left: 30px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px;
        }
        .kitchen-box {
            background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; width: 70px; height: 250px;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; transform: rotate(180deg);
            color: #CBD5E1; font-weight: 500; letter-spacing: 3px; font-size: 1.1rem;
        }

        .music-console {
            position: absolute; left: 50%; top: 43%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--color-accent);
            color: var(--color-accent); padding: 10px 40px; border-radius: 15px;
            font-size: 0.9rem; font-weight: 500; z-index: 5;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .entrance-zone {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 15vw; align-items: flex-end;
        }
        .gate-box {
            background: var(--glass-bg); border: 1px dashed rgba(255,255,255,0.2);
            padding: 15px 40px; border-radius: 15px; color: #CBD5E1; font-size: 1rem;
            backdrop-filter: blur(5px);
        }
        .gate-main { border-color: var(--color-available); color: var(--color-available); font-weight: 600; box-shadow: 0 0 20px rgba(52, 211, 153, 0.1); }

        /* --- Grid & CSS Layout Magic (จำลองจากภาพ) --- */
        .table-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7 คอลัมน์ต่อแถว (ซ้าย 2, กลาง 3, ขวา 2) */
            gap: 25px 20px;
            justify-items: center;
            position: relative;
        }

        /* ทางเดินแนวตั้งหลัก (แบ่งซ้าย-กลาง-ขวา) */
        /* หลังคอลัมน์ที่ 2 (ซ้าย) และ หลังคอลัมน์ที่ 5 (กลาง) */
        .table-card:nth-child(7n + 2) { margin-right: 90px; }
        .table-card:nth-child(7n + 5) { margin-right: 90px; }

        /* ทางเดินแนวนอน (แบ่งโซนบน-กลาง-ล่าง) */
        /* สมมติ 150 โต๊ะ = 21 แถว ตัดทางเดินหลังแถวที่ 7 (โต๊ะ 49) และ แถวที่ 14 (โต๊ะ 98) */
        .table-card:nth-child(n+43):nth-child(-n+49) { margin-bottom: 110px; }
        .table-card:nth-child(n+92):nth-child(-n+98) { margin-bottom: 110px; }


        /* --- Table Styling --- */
        .table-card {
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 85px; 
        }
        
        /* เก้าอี้รอบโต๊ะ (ใช้ border แบบ dashed สร้างเอฟเฟกต์) */
        .table-wrapper {
            position: relative; width: 70px; height: 70px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 3px dashed rgba(255,255,255,0.15); /* แทนเก้าอี้ */
            padding: 4px; transition: 0.3s;
        }

        .table-btn {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600; transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.8); border: 2px solid transparent;
        }

        /* Status Colors */
        .table-btn.ว่าง { 
            color: var(--color-available); border-color: rgba(52, 211, 153, 0.4); 
            box-shadow: inset 0 0 15px rgba(52, 211, 153, 0.1); cursor: pointer;
        }
        .table-btn.รอตรวจสอบ { 
            color: var(--color-pending); border-color: rgba(251, 191, 36, 0.4); cursor: not-allowed;
            box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.1);
        }
        .table-btn.ยืนยันแล้ว { 
            color: var(--color-confirmed); background: rgba(0,0,0,0.5); border-color: rgba(100, 116, 139, 0.3); cursor: not-allowed; 
        }

        /* Hover Effect เฉพาะโต๊ะว่าง */
        .table-wrapper.ว่าง:hover { transform: scale(1.1); border-color: rgba(52, 211, 153, 0.4); }
        .table-wrapper.ว่าง:hover .table-btn { 
            background: rgba(52, 211, 153, 0.15); box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
        }

        /* Text Below Table */
        .table-info { text-align: center; width: 100%; line-height: 1.2; }
        .info-status { font-size: 0.7rem; font-weight: 500; margin-bottom: 3px; }
        .info-status.ว่าง { color: var(--color-available); }
        .info-status.รอตรวจสอบ { color: var(--color-pending); }
        .info-status.ยืนยันแล้ว { color: var(--color-confirmed); }
        
        .info-booker { 
            font-size: 0.75rem; color: rgba(255,255,255,0.8);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 100%; padding: 3px 0; background: rgba(0,0,0,0.3); border-radius: 6px;
        }

        /* --- Glass Modal --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 17, 32, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 20px; box-sizing: border-box;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: rgba(30, 41, 59, 0.7); border: 1px solid var(--glass-border);
            padding: 35px 30px; border-radius: 24px; width: 100%; max-width: 420px;
            box-shadow: var(--glass-shadow);
            transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-content { transform: translateY(0) scale(1); }

        .modal h2 { color: var(--color-pending); margin: 0 0 20px 0; text-align: center; font-weight: 500; }

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        input {
            width: 100%; padding: 14px 16px; margin-bottom: 12px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; font-family: 'Prompt', sans-serif; box-sizing: border-box; font-size: 0.95rem;
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--color-pending); background: rgba(0,0,0,0.6); }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }

        /* Custom File Upload */
        input[type="file"] { display: none; }
        .file-upload-label { 
            display: block; border: 1px dashed rgba(255,255,255,0.3); cursor: pointer; 
            text-align: center; background: rgba(0, 0, 0, 0.2); padding: 25px 15px; 
            border-radius: 12px; margin-bottom: 15px; transition: 0.3s;
        }
        .file-upload-label:hover { background: rgba(0, 0, 0, 0.4); border-color: var(--color-pending); }
        .file-name { font-size: 0.85rem; color: var(--color-pending); margin-top: 8px; word-break: break-all; }

        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 500; 
            font-family: 'Prompt', sans-serif; cursor: pointer; transition: 0.3s; margin-top: 8px; font-size: 1rem; 
        }
        .btn-submit { 
            background: linear-gradient(135deg, #FBBF24, #D97706); color: #000; 
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2); 
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); }
        .btn-cancel { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); }
        
        #loading { text-align: center; color: rgba(255,255,255,0.7); padding: 80px 0; grid-column: 1 / -1; font-size: 1.2rem; }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="header-section">
        <h1>50 ปี โรงเรียนวังน้ำคู้ศึกษา</h1>
        <p style="color: rgba(255,255,255,0.7); margin: 0 0 20px 0;">แผนผังจองโต๊ะจีน (1 โต๊ะ = 8 ที่นั่ง)</p>
        
        <div class="status-legend">
            <span class="status-item" style="color:var(--color-available);"><i class="status-dot" style="background:var(--color-available);"></i> ว่าง (กดจองได้)</span>
            <span class="status-item" style="color:var(--color-pending);"><i class="status-dot" style="background:var(--color-pending);"></i> รอตรวจสอบ</span>
            <span class="status-item" style="color:var(--color-confirmed);"><i class="status-dot" style="background:var(--color-confirmed);"></i> ยืนยันแล้ว</span>
        </div>
    </div>

    <!-- Interactive Floor Plan -->
    <div class="venue-wrapper">
        <div class="venue-map">
            <!-- จุดตกแต่งในแผนผัง -->
            <div class="stage-area">เวทีของงาน</div>
            
            <div class="cooking-zone">
                <div class="kitchen-box">Cooking Zone</div>
                <div class="kitchen-box">Cooking Zone</div>
            </div>

            <!-- กล่องดนตรีตรงกลางผัง -->
            <div class="music-console">Music Console</div>
            
            <!-- Grid วางโต๊ะจีน -->
            <div class="table-grid" id="grid">
                <div id="loading">กำลังซิงค์แผนผังและข้อมูล... ⏳</div>
            </div>

            <div class="entrance-zone">
                <div class="gate-box">แบ็คดรอปถ่ายรูป</div>
                <div class="gate-box gate-main">➡️ ทางเข้างาน</div>
                <div class="gate-box">จุดลงทะเบียน</div>
            </div>
        </div>
    </div>

    <!-- Modal จองโต๊ะ -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2>จองโต๊ะ <span id="selectedTable"></span></h2>
            
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" required autocomplete="off">
            <input type="text" id="gen" placeholder="ศิษย์เก่ารุ่นที่ (ถ้ามี)" autocomplete="off">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์" required autocomplete="off">
            
            <div class="input-group">
                <input type="date" id="t_date" required title="วันที่โอนเงิน">
                <input type="time" id="t_time" required title="เวลาที่โอนเงิน">
            </div>

            <label class="file-upload-label" for="slip">
                <div style="font-size:2rem; margin-bottom: 5px;">📸</div>
                <div style="font-size:0.95rem;">คลิกเพื่ออัปโหลดสลิปการโอนเงิน</div>
                <div class="file-name" id="fileName">ยังไม่ได้เลือกไฟล์ (รับเฉพาะรูปภาพไม่เกิน 5MB)</div>
            </label>
            <input type="file" id="slip" accept="image/*" required>
            
            <button class="btn btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการส่งสลิปจอง</button>
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <script>
        // *** วาง URL ล่าสุดของ Google Apps Script ตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Av1q49qTxa_qC_x4jY6Fjpwz95nHow8RqDY8nfbLIXkVInhJbfyULxXheNHUbyTAA/exec';
        let currentTable = '';

        document.getElementById('slip').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "ยังไม่ได้เลือกไฟล์";
            document.getElementById('fileName').innerText = fileName;
        });

        async function loadTables() {
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                const tables = await res.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                tables.forEach((t, index) => {
                    // 1. สร้าง Card หลัก
                    const card = document.createElement('div');
                    card.className = 'table-card';

                    // 2. สร้างโครงเก้าอี้และโต๊ะ
                    const wrapper = document.createElement('div');
                    wrapper.className = `table-wrapper ${t.Status}`;
                    
                    const btn = document.createElement('div');
                    btn.className = `table-btn ${t.Status}`;
                    btn.innerText = t.Table_ID;
                    
                    if(t.Status === 'ว่าง') {
                        wrapper.onclick = () => openModal(t.Table_ID);
                        wrapper.title = "คลิกเพื่อจองโต๊ะนี้";
                        wrapper.style.cursor = 'pointer';
                    }

                    wrapper.appendChild(btn);

                    // 3. ข้อมูลแสดงใต้โต๊ะ
                    const info = document.createElement('div');
                    info.className = 'table-info';
                    
                    const statusText = document.createElement('div');
                    statusText.className = `info-status ${t.Status}`;
                    statusText.innerText = t.Status;

                    const bookerText = document.createElement('div');
                    bookerText.className = 'info-booker';
                    
                    let displayName = (t.Status !== 'ว่าง' && t.Booker_Name) ? t.Booker_Name : '-';
                    bookerText.innerText = displayName;
                    bookerText.title = displayName; 

                    info.appendChild(statusText);
                    info.appendChild(bookerText);

                    // ประกอบร่าง
                    card.appendChild(wrapper);
                    card.appendChild(info);
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('grid').innerHTML = '<div id="loading" style="color:#EF4444;">เชื่อมต่อล้มเหลว โปรดรีเฟรชหน้าเว็บใหม่</div>';
            }
        }

        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            document.getElementById('bookModal').classList.add('active');
            
            // เคลียร์ค่าเดิม
            document.getElementById('name').value = '';
            document.getElementById('gen').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('t_date').value = '';
            document.getElementById('t_time').value = '';
            document.getElementById('slip').value = '';
            document.getElementById('fileName').innerText = 'ยังไม่ได้เลือกไฟล์ (รับเฉพาะรูปภาพ)';
        }
        
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        function getBase64(file) {
           return new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.readAsDataURL(file);
             reader.onload = () => resolve(reader.result);
             reader.onerror = error => reject(error);
           });
        }

        async function submitBooking() {
            const name = document.getElementById('name').value;
            const gen = document.getElementById('gen').value;
            const phone = document.getElementById('phone').value;
            const tDate = document.getElementById('t_date').value;
            const tTime = document.getElementById('t_time').value;
            const fileInput = document.getElementById('slip');

            if(!name || !phone || !tDate || !tTime || fileInput.files.length === 0) {
                alert("กรุณากรอกข้อมูลสำคัญและแนบสลิปให้ครบถ้วน"); return;
            }

            const file = fileInput.files[0];
            if(file.size > 5 * 1024 * 1024) {
                alert("ขนาดไฟล์สลิปใหญ่เกินไป (จำกัด 5MB) กรุณาลดขนาดภาพก่อนอัปโหลด");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังอัปโหลดและส่งข้อมูล... ⏳';
            submitBtn.style.opacity = '0.7'; submitBtn.disabled = true;

            try {
                const base64Data = await getBase64(file);
                const finalFileName = `${currentTable}_${phone}_${file.name}`;

                const data = {
                    action: 'book', Table_ID: currentTable,
                    Booker_Name: name, Alumni_Gen: gen, Phone: phone,
                    Transfer_Date: tDate, Transfer_Time: tTime,
                    Slip_Base64: base64Data, Slip_Name: finalFileName
                };
                
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    alert('ส่งคำขอจองและอัปโหลดสลิปเรียบร้อยแล้ว โปรดรอตรวจสอบ');
                    closeModal(); loadTables(); 
                } else {
                    alert('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
                }
            } catch(e) {
                alert('ส่งข้อมูลสำเร็จแต่อาจใช้เวลาประมวลผลรูปภาพ กรุณารีเฟรชหน้าเว็บเพื่อตรวจสอบสถานะ');
                closeModal(); loadTables();
                console.error(e);
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.style.opacity = '1'; submitBtn.disabled = false;
            }
        }

        loadTables();
    </script>
</body>
</html>
