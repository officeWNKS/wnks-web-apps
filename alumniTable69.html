<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จองโต๊ะจีน - 50 ปี วังน้ำคู้ศึกษา</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; /* เขียว Modern */
            --bg-color: #F0FDF4; /* พื้นหลังเขียวอ่อนสบายตา */
            --card-bg: #FFFFFF;
            
            /* สีสถานะ */
            --free: #10B981;    /* เขียว - ว่าง */
            --pending: #F59E0B; /* เหลือง - รอตรวจสอบ */
            --booked: #EF4444;  /* แดง - จองแล้ว */
            
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --path-color: #E7E0C9; /* สีทางเดิน */
        }
        
        body {
            margin: 0; padding: 0; 
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-dark);
        }

        /* --- Header & Dashboard --- */
        .header-container {
            background: var(--card-bg);
            padding: 20px 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0; z-index: 50;
            border-bottom: 2px solid var(--primary);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin: 0 0 5px 0;
            font-size: clamp(1.4rem, 4vw, 2rem);
        }
        .subtitle {
            text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;
        }

        /* Dashboard Summary */
        .dashboard {
            display: flex; justify-content: space-between; gap: 8px;
            max-width: 600px; margin: 0 auto;
        }
        .dash-card {
            flex: 1; padding: 10px 5px; border-radius: 12px;
            text-align: center; font-size: 0.8rem; font-weight: 600;
            background: var(--bg-color); border: 1px solid rgba(0,0,0,0.05);
        }
        .dash-card.free { color: var(--free); background: #ECFDF5; border-color: #D1FAE5;}
        .dash-card.pending { color: var(--pending); background: #FFFBEB; border-color: #FEF3C7;}
        .dash-card.booked { color: var(--booked); background: #FEF2F2; border-color: #FEE2E2;}
        .dash-num { font-size: 1.4rem; display: block; margin-top: 2px; }

        /* --- Map Layout System --- */
        .map-wrapper {
            padding: 20px 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Grid 9 คอลัมน์ (โต๊ะ 2 + ทาง 1 + โต๊ะ 3 + ทาง 1 + โต๊ะ 2) */
        .table-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 12px 1fr 1fr 1fr 12px 1fr 1fr;
            gap: 12px 6px; /* ระยะห่างปรับให้พอดีมือถือ */
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            justify-items: center; align-items: center;
        }

        @media (min-width: 768px) {
            .table-grid { gap: 15px 10px; grid-template-columns: 1fr 1fr 20px 1fr 1fr 1fr 20px 1fr 1fr; padding: 30px; }
        }

        /* ทางเดิน (Aisles) */
        .aisle-v { width: 100%; height: 100%; background: var(--path-color); border-radius: 20px; }
        .aisle-h { grid-column: 1 / -1; width: 100%; height: 35px; background: var(--path-color); border-radius: 10px; margin: 10px 0; }
        
        .music-console {
            background: var(--text-dark); color: white;
            border-radius: 8px; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 600; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .cooking-badge {
            grid-column: 1 / span 3;
            background: #F1F5F9; border-left: 4px solid var(--text-muted);
            color: var(--text-dark); font-size: 0.75rem; padding: 5px;
            border-radius: 4px; text-align: center; width: 100%; font-weight: 600;
        }

        /* --- Table Item --- */
        .table-item { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
        .table-circle {
            width: clamp(35px, 8vw, 55px);
            height: clamp(35px, 8vw, 55px);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            font-weight: 600; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s; position: relative;
        }
        
        /* สไตล์ตามสถานะ */
        .status-free { background: var(--free); cursor: pointer; }
        .status-free:active { transform: scale(0.9); }
        .status-pending { background: var(--pending); cursor: help; }
        .status-booked { background: var(--booked); cursor: not-allowed; opacity: 0.8; }

        /* VIP Tag */
        .vip::before {
            content: 'VIP'; position: absolute; top: -10px;
            background: #FBBF24; color: #000; font-size: 0.55rem;
            padding: 2px 6px; border-radius: 10px; font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .table-name {
            font-size: 0.6rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 100%; max-width: 50px; text-align: center; height: 12px;
        }

        /* --- Modal Form --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s; padding: 15px;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--card-bg); border-radius: 20px;
            width: 100%; max-width: 400px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px); transition: 0.3s;
            max-height: 90vh; overflow-y: auto;
        }
        .modal.active .modal-content { transform: translateY(0); }
        .modal h2 { margin-top: 0; color: var(--primary); text-align: center; border-bottom: 2px solid #F1F5F9; padding-bottom: 15px;}

        /* Form Elements */
        .payment-toggle { display: flex; background: #F1F5F9; border-radius: 12px; margin-bottom: 20px; padding: 4px; position: relative; }
        .payment-toggle label { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); z-index: 1; transition: 0.3s; }
        .payment-toggle input { display: none; }
        .payment-toggle input:checked + label { color: white; }
        .toggle-highlighter { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--primary); border-radius: 8px; transition: 0.3s; z-index: 0; }
        #pay-cash:checked ~ .toggle-highlighter { left: 50%; }

        .form-control { width: 100%; padding: 12px 15px; margin: 6px 0; border-radius: 10px; background: #F8FAFC; border: 1px solid #E2E8F0; color: var(--text-dark); font-family: 'Prompt', sans-serif; box-sizing: border-box; transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        .input-group-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .transfer-section { transition: 0.3s; overflow: hidden; }
        .file-upload-label { display: block; border: 2px dashed #CBD5E1; cursor: pointer; text-align: center; background: #F8FAFC; padding: 20px 10px; border-radius: 12px; margin: 10px 0; transition: 0.2s; color: var(--text-muted); }
        .file-upload-label:hover { border-color: var(--primary); color: var(--primary); }
        .file-name { font-size: 0.8rem; margin-top: 8px; color: var(--primary); font-weight: 500;}
        input[type="file"] { display: none; }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-family: 'Prompt', sans-serif; cursor: pointer; transition: 0.2s; margin-top: 10px; font-size: 1rem; }
        .btn-submit { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(5,150,105,0.3); }
        .btn-submit:hover { background: #047857; }
        .btn-cancel { background: #F1F5F9; color: var(--text-muted); }
        .btn-cancel:hover { background: #E2E8F0; }

        /* Loader & Toast */
        .loader { border: 4px solid #E2E8F0; border-left-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-container { grid-column: 1 / -1; text-align: center; color: var(--primary); padding: 40px 0; font-weight: 500; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-dark); color: white; padding: 12px 24px; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; font-weight: 500; opacity: 0; visibility: hidden; transition: 0.4s; z-index: 1000; font-size: 0.9rem; white-space: nowrap;}
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
        
    </style>
</head>
<body>

    <div class="header-container">
        <h1>50 ปี วังน้ำคู้ศึกษา</h1>
        <div class="subtitle">ระบบจองโต๊ะจีนออนไลน์ (1 โต๊ะ = 8 ที่นั่ง)</div>
        
        <!-- สรุปข้อมูลเรียลไทม์ -->
        <div class="dashboard">
            <div class="dash-card free">
                <div>เหลือว่าง</div>
                <div class="dash-num" id="count-free">-</div>
            </div>
            <div class="dash-card pending">
                <div>รอตรวจสอบ</div>
                <div class="dash-num" id="count-pending">-</div>
            </div>
            <div class="dash-card booked">
                <div>จองแล้ว</div>
                <div class="dash-num" id="count-booked">-</div>
            </div>
        </div>
    </div>

    <div class="map-wrapper">
        <div class="table-grid" id="grid">
            <div id="loading-container">
                <div class="loader"></div>
                กำลังดึงข้อมูลโต๊ะล่าสุด...
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2>จองโต๊ะ <span id="selectedTable"></span></h2>
            
            <div class="payment-toggle">
                <input type="radio" id="pay-transfer" name="pay_type" value="transfer" checked onchange="togglePaymentMode()">
                <label for="pay-transfer">💳 โอนเงิน</label>
                
                <input type="radio" id="pay-cash" name="pay_type" value="cash" onchange="togglePaymentMode()">
                <label for="pay-cash">💵 จ่ายหน้างาน</label>
                <div class="toggle-highlighter"></div>
            </div>
            
            <input type="text" class="form-control" id="name" placeholder="ชื่อ-นามสกุล (ผู้จอง)" autocomplete="off">
            <input type="text" class="form-control" id="gen" placeholder="ศิษย์เก่ารุ่นที่ (ถ้ามี)" autocomplete="off">
            <input type="tel" class="form-control" id="phone" placeholder="เบอร์โทรศัพท์" autocomplete="off">
            
            <div class="transfer-section" id="transferSection">
                <div class="input-group-row">
                    <input type="date" class="form-control" id="t_date" title="วันที่โอนเงิน">
                    <input type="time" class="form-control" id="t_time" title="เวลาที่โอนเงิน">
                </div>
                <label class="file-upload-label" for="slip">
                    <div style="font-size:1.8rem; margin-bottom: 5px;">📥</div>
                    <div>คลิกเพื่อแนบสลิปโอนเงิน</div>
                    <div class="file-name" id="fileName">รับเฉพาะรูปภาพไม่เกิน 5MB</div>
                </label>
                <input type="file" id="slip" accept="image/*">
            </div>
            
            <button class="btn btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการจอง</button>
            <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">ข้อความ</span>
    </div>

    <script>
        // *** วาง URL ของ Google Apps Script ของคุณตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Av1q49qTxa_qC_x4jY6Fjpwz95nHow8RqDY8nfbLIXkVInhJbfyULxXheNHUbyTAA/exec';
        let currentTable = '';
        let tableDataMap = new Map();

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerText = message;
            document.getElementById('toastIcon').innerText = type === 'success' ? '✅' : 'ℹ️';
            toast.className = 'toast show';
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function togglePaymentMode() {
            const payType = document.querySelector('input[name="pay_type"]:checked').value;
            const sec = document.getElementById('transferSection');
            if(payType === 'cash') {
                sec.style.opacity = '0';
                setTimeout(() => { sec.style.display = 'none'; }, 200);
            } else {
                sec.style.display = 'block';
                setTimeout(() => { sec.style.opacity = '1'; }, 10);
            }
        }

        document.getElementById('slip').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "รับเฉพาะรูปภาพไม่เกิน 5MB";
            document.getElementById('fileName').innerText = fileName;
        });

        function createTableCard(t) {
            if(!t) return '<div></div>'; 
            
            // VIP โต๊ะ 3, 4, 5
            const isVIP = ['T3', 'T4', 'T5'].includes(t.Table_ID);
            
            let statusClass = 'status-free';
            if(t.Status === 'รอตรวจสอบ') statusClass = 'status-pending';
            if(t.Status === 'ยืนยันแล้ว') statusClass = 'status-booked';

            let displayName = (t.Status !== 'ว่าง' && t.Booker_Name) ? t.Booker_Name : '';
            
            // หากว่างให้กดจองได้ หากไม่ว่างให้โชว์ Toast
            let onclickAction = t.Status === 'ว่าง' 
                ? `onclick="openModal('${t.Table_ID}')"` 
                : `onclick="showToast('โต๊ะ ${t.Table_ID} ${t.Status}โดย: ${displayName || 'ไม่ระบุ'}', 'info')"`;

            return `
                <div class="table-item">
                    <div class="table-circle ${statusClass} ${isVIP ? 'vip' : ''}" ${onclickAction}>
                        ${t.Table_ID.replace('T', '')}
                    </div>
                    <div class="table-name">${displayName}</div>
                </div>
            `;
        }

        async function loadTables() {
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                const tables = await res.json();
                
                // อัปเดต Dashboard[cite: 1]
                let cFree = 0, cPending = 0, cBooked = 0;
                tables.forEach(t => {
                    tableDataMap.set(t.Table_ID, t);
                    if (t.Status === 'ว่าง') cFree++;
                    else if (t.Status === 'รอตรวจสอบ') cPending++;
                    else if (t.Status === 'ยืนยันแล้ว') cBooked++;
                });
                document.getElementById('count-free').innerText = cFree;
                document.getElementById('count-pending').innerText = cPending;
                document.getElementById('count-booked').innerText = cBooked;

                // สร้าง Layout 150 โต๊ะ เป๊ะตามแปลน
                let html = '';
                let tNum = 1;

                const addRow = (colA, colB, colC) => {
                    for(let i=0; i<colA; i++) html += createTableCard(tableDataMap.get(`T${tNum++}`));
                    html += `<div class="aisle-v"></div>`;
                    for(let i=0; i<colB; i++) html += createTableCard(tableDataMap.get(`T${tNum++}`));
                    html += `<div class="aisle-v"></div>`;
                    for(let i=0; i<colC; i++) html += createTableCard(tableDataMap.get(`T${tNum++}`));
                };

                // --- Section 1 (แถว 1-7 รวม 49 โต๊ะ) ---
                for(let r=0; r<7; r++) addRow(2, 3, 2);

                // --- ทางเดินขวางที่ 1 + เวทีดนตรี ---
                html += `<div class="aisle-h" style="grid-column: 1 / span 3;"></div>`;
                html += `<div class="music-console" style="grid-column: 4 / span 3;">🎵 Music Console</div>`;
                html += `<div class="aisle-h" style="grid-column: 7 / span 3;"></div>`;

                // --- Section 2 (แถว 8-14 รวม 49 โต๊ะ) ---
                // เพิ่มป้าย Cooking Zone บอกตำแหน่ง
                html += `<div class="cooking-badge">🍳 โซนทำอาหารอยู่ด้านซ้ายมือ</div>`;
                html += `<div style="grid-column: 4 / -1;"></div>`; // เว้นว่างขวา
                
                for(let r=0; r<7; r++) addRow(2, 3, 2);

                // --- ทางเดินขวางที่ 2 ---
                html += `<div class="aisle-h"></div>`;

                // --- Section 3 (แถว 15-21 รวม 49 โต๊ะ) ---
                for(let r=0; r<7; r++) addRow(2, 3, 2);

                // --- Section 3 ติ่งสุดท้าย (แถว 22 มีแค่ 3 โต๊ะตรงกลาง รวมเป็น 52 โต๊ะของโซนนี้) ---
                html += `<div></div><div></div> <div class="aisle-v"></div>`; // A ว่าง
                html += createTableCard(tableDataMap.get(`T${tNum++}`));
                html += createTableCard(tableDataMap.get(`T${tNum++}`));
                html += createTableCard(tableDataMap.get(`T${tNum++}`)); // B 3 โต๊ะ (โต๊ะ 148, 149, 150)
                html += `<div class="aisle-v"></div> <div></div><div></div>`; // C ว่าง

                document.getElementById('grid').innerHTML = html;

            } catch (error) {
                document.getElementById('grid').innerHTML = '<div id="loading-container" style="color:var(--booked);">❌ เชื่อมต่อล้มเหลว โปรดรีเฟรชหน้าเว็บใหม่</div>';
            }
        }

        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('selectedTable').innerText = tableId;
            
            document.getElementById('name').value = '';
            document.getElementById('gen').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('t_date').value = '';
            document.getElementById('t_time').value = '';
            document.getElementById('slip').value = '';
            document.getElementById('fileName').innerText = 'รับเฉพาะรูปภาพไม่เกิน 5MB';
            
            document.getElementById('pay-transfer').checked = true;
            togglePaymentMode();
            document.getElementById('bookModal').classList.add('active');
        }
        
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        function getBase64(file) {
           return new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.readAsDataURL(file);
             reader.onload = () => resolve(reader.result);
             reader.onerror = error => reject(error);
           });
        }

        async function submitBooking() {
            const name = document.getElementById('name').value.trim();
            const gen = document.getElementById('gen').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const payType = document.querySelector('input[name="pay_type"]:checked').value;
            
            if(!name || !gen || !phone) { showToast("กรุณากรอกข้อมูลให้ครบ", "error"); return; }

            let finalTDate = "-", finalTTime = "-", finalFileName = "จ่ายเงินสดหน้างาน", base64Data = "";

            if (payType === 'transfer') {
                const tDate = document.getElementById('t_date').value;
                const tTime = document.getElementById('t_time').value;
                const fileInput = document.getElementById('slip');

                if(!tDate || !tTime || fileInput.files.length === 0) {
                    showToast("กรุณากรอกวันเวลาและแนบสลิป", "error"); return;
                }
                const file = fileInput.files[0];
                if(file.size > 5 * 1024 * 1024) {
                    showToast("ขนาดไฟล์เกิน 5MB", "error"); return;
                }

                finalTDate = tDate; finalTTime = tTime;
                finalFileName = `${currentTable}_${phone}_${file.name}`;
                base64Data = await getBase64(file);
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = '⏳ กำลังส่งข้อมูล...';
            submitBtn.disabled = true;

            try {
                const data = {
                    action: 'book', Table_ID: currentTable,
                    Booker_Name: name, Alumni_Gen: gen, Phone: phone,
                    Transfer_Date: finalTDate, Transfer_Time: finalTTime,
                    Slip_Base64: base64Data, Slip_Name: finalFileName
                };
                
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    showToast('✅ จองสำเร็จ! รอแอดมินตรวจสอบ');
                    closeModal(); 
                    document.getElementById('grid').innerHTML = '<div id="loading-container"><div class="loader"></div>กำลังโหลดข้อมูลใหม่...</div>';
                    loadTables(); 
                } else {
                    showToast(result.message, "error");
                }
            } catch(e) {
                showToast('ส่งคำขอแล้ว กำลังรีเฟรชหน้า...');
                closeModal(); loadTables();
            } finally {
                submitBtn.innerText = originalText; submitBtn.disabled = false;
            }
        }

        loadTables();
    </script>
</body>
</html>
