<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการโต๊ะจีน 50 ปี</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A; --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08); --gold: #D4AF37;
        }
        body { 
            font-family: 'Prompt', sans-serif; background: var(--bg-color); color: white; padding: 15px; 
            overflow-x: hidden; margin: 0;
        }
        
        body::before {
            content: ''; position: fixed; top: -20%; left: -10%; width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, transparent 70%); z-index: -1;
        }

        .glass-container {
            max-width: 1400px; margin: 0 auto;
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .header-box { display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }

        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.95rem; }
        th, td { padding: 12px 15px; text-align: left; }
        th { background: rgba(255,255,255,0.05); color: var(--gold); font-weight: 500; border-bottom: 1px solid var(--glass-border); }
        td { border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        tr:hover td { background: rgba(255,255,255,0.05); }

        button, .btn-link {
            font-family: 'Prompt', sans-serif; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem;
            cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
        }
        .btn-approve { background: rgba(74, 222, 128, 0.15); color: #4ADE80; border: 1px solid rgba(74, 222, 128, 0.3); margin-right: 5px; }
        .btn-approve:hover { background: #4ADE80; color: #000; }
        
        .btn-cancel { background: rgba(248, 113, 113, 0.1); color: #F87171; border: 1px solid rgba(248, 113, 113, 0.2); }
        .btn-cancel:hover { background: #F87171; color: #fff; }

        .btn-slip { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn-slip:hover { background: #38BDF8; color: #000; }

        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; display: inline-block; }
        .status-pending { background: rgba(251, 191, 36, 0.15); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .status-confirmed { background: rgba(74, 222, 128, 0.15); color: #4ADE80; border: 1px solid rgba(74, 222, 128, 0.3); }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="header-box">
            <h2 style="color: var(--gold); margin:0;">ระบบหลังบ้าน</h2>
            <button onclick="loadAdminData()" style="background:rgba(255,255,255,0.1); color:white; border:1px solid rgba(255,255,255,0.2); font-size:1rem; padding: 8px 15px;">🔄 รีเฟรชข้อมูล</button>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>โต๊ะ</th><th>สถานะ</th><th>ผู้จอง</th><th>รุ่น</th><th>เบอร์โทร</th>
                        <th>วันที่โอน</th><th>เวลาโอน</th><th>สลิป</th><th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="admin-table">
                    <tr><td colspan="9" style="text-align:center; padding: 40px; color:rgba(255,255,255,0.5);">กำลังโหลดข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // *** เปลี่ยน URL นี้ให้เป็นของที่คุณ Deploy ใหม่ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9JKyiqStSo6ncEmYKjSrVwzgIjc2ZvRJi_b_huBKsDqXlHYeFqvKqULpfvLgqfPspxA/exec';

        // ฟังก์ชันจัดฟอร์แมตวันที่ให้สวยงาม
        function formatDate(dateString) {
            if(!dateString) return '-';
            // ถ้าเป็น format จาก type="date" เช่น 2024-03-25
            if(dateString.includes('-')) {
                const parts = dateString.split('T')[0].split('-');
                if(parts.length === 3) {
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
            }
            return dateString;
        }

        async function loadAdminData() {
            const tbody = document.getElementById('admin-table');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px; color:rgba(255,255,255,0.5);">กำลังโหลดข้อมูล... ⏳</td></tr>';
            
            try {
                const res = await fetch(SCRIPT_URL, { redirect: "follow" });
                const tables = await res.json();
                tbody.innerHTML = '';
                
                let count = 0;
                tables.forEach(t => {
                    if(t.Status !== 'ว่าง') {
                        count++;
                        let statusHtml = t.Status === 'รอตรวจสอบ' 
                            ? '<span class="status-badge status-pending">🟡 รอตรวจสอบ</span>'
                            : '<span class="status-badge status-confirmed">🟢 ยืนยันแล้ว</span>';
                            
                        let slipHtml = t.Slip_URL 
                            ? `<a href="${t.Slip_URL}" target="_blank" class="btn-link btn-slip">📄 ดูสลิป</a>` 
                            : '<span style="color:#94A3B8;">ไม่มีไฟล์</span>';
                            
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight:500; color:white;">${t.Table_ID}</td>
                                <td>${statusHtml}</td>
                                <td>${t.Booker_Name}</td>
                                <td>${t.Alumni_Gen}</td>
                                <td>${t.Phone}</td>
                                <td>${formatDate(t.Transfer_Date)}</td>
                                <td>${t.Transfer_Time || '-'}</td>
                                <td>${slipHtml}</td>
                                <td>
                                    ${t.Status === 'รอตรวจสอบ' ? `<button class="btn-approve" onclick="updateStatus('${t.Table_ID}', 'approve')">✔ ยืนยัน</button>` : ''}
                                    <button class="btn-cancel" onclick="updateStatus('${t.Table_ID}', 'cancel')">✖ ยกเลิก</button>
                                </td>
                            </tr>
                        `;
                    }
                });

                if(count === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px; color:rgba(255,255,255,0.3);">ยังไม่มีข้อมูลการจองโต๊ะในขณะนี้</td></tr>';
                }
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px; color:#F87171;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        async function updateStatus(tableId, action) {
            let msg = action === 'approve' ? `คุณต้องการ "ยืนยัน" การจองโต๊ะ ${tableId} ใช่หรือไม่?` : `คุณต้องการ "ยกเลิก/ลบ" โต๊ะ ${tableId} ใช่หรือไม่?`;
            
            if(confirm(msg)) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: action, Table_ID: tableId })
                    });
                    loadAdminData(); 
                } catch(e) {
                    alert('เกิดข้อผิดพลาดในการอัปเดตข้อมูล');
                }
            }
        }

        loadAdminData();
    </script>
</body>
</html>
