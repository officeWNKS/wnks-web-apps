<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการโต๊ะจีน</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0a1321; color: white; padding: 20px; }
        .glass-container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 15px; padding: 20px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { color: #D4AF37; }
        .btn-approve { background: #4CAF50; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;}
        .btn-cancel { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="glass-container">
        <h2 style="color: #D4AF37;">ระบบหลังบ้าน - จัดการการจองโต๊ะ</h2>
        <table>
            <thead>
                <tr>
                    <th>โต๊ะ</th><th>สถานะ</th><th>ชื่อผู้จอง</th><th>รุ่น</th><th>เบอร์โทร</th><th>เลขอ้างอิง</th><th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="admin-table">
                <tr><td colspan="7">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9JKyiqStSo6ncEmYKjSrVwzgIjc2ZvRJi_b_huBKsDqXlHYeFqvKqULpfvLgqfPspxA/exec'; // <<<<<<< แก้ไขตรงนี้ (URL เดียวกับหน้า public)

        async function loadAdminData() {
            const res = await fetch(SCRIPT_URL);
            const tables = await res.json();
            const tbody = document.getElementById('admin-table');
            tbody.innerHTML = '';
            
            tables.forEach(t => {
                if(t.Status !== 'ว่าง') { // แสดงเฉพาะโต๊ะที่มีการจอง
                    tbody.innerHTML += `
                        <tr>
                            <td>${t.Table_ID}</td>
                            <td style="color:${t.Status==='รอตรวจสอบ' ? 'yellow' : '#4CAF50'}">${t.Status}</td>
                            <td>${t.Booker_Name}</td>
                            <td>${t.Alumni_Gen}</td>
                            <td>${t.Phone}</td>
                            <td>${t.Ref_Code}</td>
                            <td>
                                ${t.Status === 'รอตรวจสอบ' ? `<button class="btn-approve" onclick="updateStatus('${t.Table_ID}', 'approve')">ยืนยัน</button>` : ''}
                                <button class="btn-cancel" onclick="updateStatus('${t.Table_ID}', 'cancel')">ยกเลิก/ลบ</button>
                            </td>
                        </tr>
                    `;
                }
            });
        }

        async function updateStatus(tableId, action) {
            if(confirm(action === 'approve' ? 'ยืนยันการจองโต๊ะนี้?' : 'ยกเลิกการจองและทำให้โต๊ะว่าง?')) {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, Table_ID: tableId })
                });
                loadAdminData(); // รีโหลดข้อมูลใหม่
            }
        }

        loadAdminData();
    </script>
</body>
</html>
